name: "SonarQube Analyzer .NET"
description: "Se realiza el análisis en sonarqube para NET"
inputs:
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: true
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: true
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'
  sonar_url:
    description: "url sonarqube"
    required: true
  sonar_token:
    description: "token sonarqube"
    required: true
  sonar_key:
    description: "Key del repositorio"
    required: true
  sonar_custom:
    description: "config sonar custom"
    default: ""
  dotnet-version:
    description: "versiones de dotnet"
    required: false
    default: "8.0.x"
  sentinel_url:
    description: "URL base de la API de Sentinel (sin trailing slash)"
    required: false
    default: "https://sentinel-api-gitops-test.apps.ocptest.andreani.com.ar"
  sentinel_sensor_id:
    description: "ID del sensor en Sentinel al que se reportan los análisis"
    required: false
    default: "1"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Key Repository
      id: variables
      uses: actions/github-script@v7
      with:
        script: |
          const name = context.repo.repo
          const organization = context.repo.owner
          core.exportVariable('KEY_REPOSITORY', `${organization}_${name}`)

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup NuGet sources
      shell: bash
      env:
        NUGET_USERNAME: ${{ inputs.github_username }}
        NUGET_PASSWORD: ${{ inputs.github_token }}
      run: bash "${{ github.action_path }}/scripts/setup_nuget.sh"

    - name: Create Sentinel Scan
      id: sentinel-scan
      shell: bash
      run: |
        REPO_ID="${{ github.repository_id }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        TRIGGERED_BY="${{ github.actor }}"
        PR_NUMBER="${{ github.event.pull_request.number }}"
        PR_TITLE="${{ github.event.pull_request.title }}"

        BODY=$(jq -n \
          --arg branch        "$BRANCH" \
          --arg commitSha     "$COMMIT_SHA" \
          --arg triggeredBy   "$TRIGGERED_BY" \
          --arg prNumber      "$PR_NUMBER" \
          --arg prTitle       "$PR_TITLE" \
          '{
            branch:            $branch,
            commitSha:         $commitSha,
            pullRequestNumber: (if $prNumber == "" then null else ($prNumber | tonumber) end),
            pullRequestTitle:  (if $prTitle  == "" then null else $prTitle end),
            triggeredBy:       $triggeredBy
          }')

        echo "Request body: $BODY"

        RESPONSE=$(curl -s -X POST \
          "${{ inputs.sentinel_url }}/api/v1/repository/${REPO_ID}/scans" \
          -H "Content-Type: application/json" \
          -d "$BODY")

        echo "Sentinel response: $RESPONSE"

        SCAN_ID=$(echo "$RESPONSE" | jq -r '.scanId')

        if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
          echo "ERROR: No se pudo obtener el scanId de Sentinel"
          exit 1
        fi

        echo "SCAN_ID=${SCAN_ID}" >> $GITHUB_ENV
        echo "scanId=${SCAN_ID}" >> $GITHUB_OUTPUT
        echo "Sentinel Scan creado con ID: ${SCAN_ID}"

    - name: Install Roslyn Analyzers
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        if [ ! -f Directory.Build.props ]; then
          cat > Directory.Build.props << 'EOF'
        <Project>
          <ItemGroup>
            <PackageReference Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="8.0.0" PrivateAssets="all" />
          </ItemGroup>
        </Project>
        EOF
        fi

    - name: Restore
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: dotnet restore

    - name: Add editorconfig
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        if [ ! -f .editorconfig ]; then
          printf "root = true\n[*]\n" > .editorconfig
        fi
        for diag in \
          "dotnet_diagnostic.CA1873.severity = none" \
          "dotnet_diagnostic.CA1707.severity = none" \
          "dotnet_diagnostic.CS1591.severity = none" \
          "dotnet_diagnostic.ORLEANS0010.severity = none"; do
          grep -qxF "$diag" .editorconfig || echo "$diag" >> .editorconfig
        done

    - name: Build
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: dotnet build --no-restore

    - name: Test 
      env:
        ASPNETCORE_ENVIRONMENT: Development
      shell: bash
      run: dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover --results-directory TestResults/ --logger "trx;LogFileName=test-results.trx"
      working-directory: ${{ inputs.workdir_test }}

    - name: Install ReportGenerator
      shell: bash
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Generate Coverage XML Report (Cobertura)
      shell: bash
      run: |
        reportgenerator \
          "-reports:${{ inputs.workdir_test }}TestResults/**/coverage.opencover.xml" \
          "-targetdir:${{ github.workspace }}/coverage-report" \
          "-reporttypes:Cobertura"

    - name: Upload Coverage XML Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-xml
        path: ${{ github.workspace }}/coverage-report/Cobertura.xml

    - name: Send Coverage report to Sentinel
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "Coverlet"
        REPORT_PATH: ${{ github.workspace }}/coverage-report/Cobertura.xml
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Roslyn Analyzers ──────────────────────────────────────────────────────
    - name: Run Roslyn Analyzers
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        set +e
        dotnet format analyzers \
          --severity warn \
          --verify-no-changes \
          --report "${{ github.workspace }}/roslyn-report"
        EXIT_CODE=$?
        set -e

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "✅ Roslyn Analyzers: no se encontraron issues."
        elif [ "$EXIT_CODE" -eq 2 ]; then
          echo "✅ Roslyn Analyzers: se encontraron issues/warnings. Ver roslyn-report/format-report.json para el detalle."
        else
          echo "❌ Error inesperado en dotnet format analyzers (exit code: $EXIT_CODE)."
          exit "$EXIT_CODE"
        fi

    - name: Upload Roslyn Analysis Report
      uses: actions/upload-artifact@v4
      with:
        name: roslyn-analysis-report
        path: ${{ github.workspace }}/roslyn-report/format-report.json

    - name: Send Roslyn report to Sentinel
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "roslyn"
        REPORT_PATH: ${{ github.workspace }}/roslyn-report/format-report.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Métricas de consumo: cloc (Count Lines of Code) ──────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install cloc
      shell: bash
      run: |
        if command -v apt-get &>/dev/null; then
          sudo apt-get install -y perl
        elif command -v apk &>/dev/null; then
          apk add --no-cache perl
        elif command -v yum &>/dev/null; then
          sudo yum install -y perl
        else
          echo "⚠️ No se encontró gestor de paquetes, intentando continuar..."
        fi
        npm install -g cloc

    - name: Run cloc – Code Metrics
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        cloc . \
          --json \
          --out="${{ github.workspace }}/cloc-report.json" \
          --exclude-dir=bin,obj,.vs,.git,.github,TestResults,coverage-report,roslyn-report,packages \
          --exclude-ext=user,suo,DotSettings,nupkg \
          --not-match-f="\.(g\.cs|Designer\.cs|AssemblyInfo\.cs|gitignore|gitattributes|editorconfig|sln\.DotSettings)$" \
          --fullpath \
          --verbose=0

    - name: Upload cloc Report
      uses: actions/upload-artifact@v4
      with:
        name: cloc-code-metrics-report
        path: ${{ github.workspace }}/cloc-report.json

    - name: Send cloc report to Sentinel
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "cloc"
        REPORT_PATH: ${{ github.workspace }}/cloc-report.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Detección de código duplicado: jscpd ─────────────────────────────────
    - name: Install jscpd
      shell: bash
      run: npm install -g jscpd

    - name: Run jscpd – Duplicate Code Detection
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        jscpd . \
          --reporters "json" \
          --output "${{ github.workspace }}/jscpd-report" \
          --min-lines 5 \
          --min-tokens 50 \
          --threshold 0 \
          --ignore "**/bin/**,**/obj/**,**/.vs/**,**/.git/**,**/.github/**,**/TestResults/**,**/coverage-report/**,**/roslyn-report/**,**/packages/**,**/*.Designer.cs,**/*.g.cs,**/*.AssemblyInfo.cs" \
          --format "csharp,xml,json,yaml,markdown"

    - name: Upload jscpd Report
      uses: actions/upload-artifact@v4
      with:
        name: jscpd-duplicate-code-report
        path: ${{ github.workspace }}/jscpd-report/jscpd-report.json

    - name: Send jscpd report to Sentinel
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "jscpd"
        REPORT_PATH: ${{ github.workspace }}/jscpd-report/jscpd-report.json
        IS_LAST_REPORT: "true"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"
