name: "SonarQube Analyzer .NET"
description: "Se realiza el análisis en sonarqube para NET"
inputs:
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: true
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: true
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'
  sonar_url: 
    description: "url sonarqube"
    required: true
  sonar_token: 
    description: "token sonarqube"
    required: true
  sonar_key:
    description: "Key del repositorio"
    required: true
  sonar_custom:
    description: "config sonar custom"
    default: ""
  dotnet-version: 
    description: "versiones de dotnet"
    required: false
    default: "8.0.x"
runs:
  using: "composite"
  steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Key Repository
        id: variables
        uses: actions/github-script@v7
        with:
          script: |
            const name = context.repo.repo
            const organization = context.repo.owner
            core.exportVariable('KEY_REPOSITORY', `${organization}_${name}`)

      - name: Setup Pre requisitos
        uses: architecture-it/actions@sonar-prerequisitos
        with:
          sonar_url: ${{ inputs.sonar_url }}
          sonar_token: ${{ inputs.sonar_token }}
          sonar_key:  ${{ env.KEY_REPOSITORY }}
            
      - name: Setup dotnet
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Sonarqube Begin
        run: |
          dotnet nuget locals -c all
          dotnet nuget add source https://nuget.pkg.github.com/architecture-it/index.json --name architecture-it -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/operations-innovation/index.json --name operations-innovation -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/customer-experience/index.json --name customer-experience -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/warehouse-andreani/index.json --name warehouse-andreani -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/witwot-jms/index.json --name witwot-jms -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
          dotnet nuget add source https://nuget.pkg.github.com/corporate-solutions-gla/index.json --name corporate-solutions-gla -u ${{ inputs.github_username }} -p ${{ inputs.github_token }} --store-password-in-clear-text
        shell: bash
        
      - name: Create Sentinel Scan
        id: sentinel-scan
        run: |
          REPO_ID="${{ github.repository_id }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          TRIGGERED_BY="${{ github.actor }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          BODY=$(jq -n \
            --arg branch        "$BRANCH" \
            --arg commitSha     "$COMMIT_SHA" \
            --arg triggeredBy   "$TRIGGERED_BY" \
            --arg prNumber      "$PR_NUMBER" \
            --arg prTitle       "$PR_TITLE" \
            '{
              branch:            $branch,
              commitSha:         $commitSha,
              pullRequestNumber: (if $prNumber == "" then null else ($prNumber | tonumber) end),
              pullRequestTitle:  (if $prTitle  == "" then null else $prTitle end),
              triggeredBy:       $triggeredBy
            }')

          echo "Request body: $BODY"

          RESPONSE=$(curl -s -X POST \
            "https://sentinel-api-gitops-test.apps.ocptest.andreani.com.ar/api/v1/repository/${REPO_ID}/scans" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "Sentinel response: $RESPONSE"

          SCAN_ID=$(echo "$RESPONSE" | jq -r '.scanId')

          if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
            echo "ERROR: No se pudo obtener el scanId de Sentinel"
            exit 1
          fi

          echo "SCAN_ID=${SCAN_ID}" >> $GITHUB_ENV
          echo "scanId=${SCAN_ID}" >> $GITHUB_OUTPUT
          echo "Sentinel Scan creado con ID: ${SCAN_ID}"
        shell: bash
        
      - name: Install Roslyn Analyzers
        run: |
          if [ ! -f Directory.Build.props ]; then
            cat > Directory.Build.props << 'EOF'
          <Project>
            <ItemGroup>
              <PackageReference Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="8.0.0" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          fi
        shell: bash
        working-directory: ${{ inputs.workdir_src }}

      - name: Restore 
        run: dotnet restore
        shell: bash
        
        working-directory: ${{ inputs.workdir_src }}

      - name: Add editorconfig
        run: |
          echo root = true >> .editorconfig
          echo [*] >> .editorconfig
          echo dotnet_diagnostic.CA1873.severity = none >> .editorconfig
          echo dotnet_diagnostic.CA1707.severity = none >> .editorconfig
          echo dotnet_diagnostic.CS1591.severity = none >> .editorconfig
          echo dotnet_diagnostic.ORLEANS0010.severity = none >> .editorconfig

        shell: bash
        working-directory: ${{ inputs.workdir_src }}
      - name: Build
        run: dotnet build
        shell: bash
        working-directory: ${{ inputs.workdir_src }}

      - name: Test 
        env:
          ASPNETCORE_ENVIRONMENT: Development
        shell: bash
        run: dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover --results-directory TestResults/ --logger "trx;LogFileName=test-results.trx"
        working-directory: ${{ inputs.workdir_test }}

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
        shell: bash

      - name: Generate Coverage XML Report (Cobertura)
        run: |
          reportgenerator \
            -reports:"${{ inputs.workdir_test }}/TestResults/**/coverage.opencover.xml" \
            -targetdir:"${{ github.workspace }}/coverage-report" \
            -reporttypes:"Cobertura" \
            -verbosity:Info
        shell: bash

      - name: Upload Coverage XML Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: ${{ github.workspace }}/coverage-report/Cobertura.xml

      - name: Run Roslyn Analyzers
        continue-on-error: true
        run: dotnet format analyzers --severity warn --verify-no-changes --report ${{ github.workspace }}/auditoria_resultados
        shell: bash
        working-directory: ${{ inputs.workdir_src }}

      - name: Convert Roslyn Report to XML
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_dir = Path("${{ github.workspace }}/auditoria_resultados")
          xml_path = "${{ github.workspace }}/roslyn-analysis.xml"

          root = ET.Element(
              "RoslynAnalysisReport",
              {
                  "generatedAt": datetime.now(timezone.utc).isoformat(),
                  "tool": "dotnet-format",
                  "severity": "warn",
              },
          )

          if report_dir.exists():
              for json_file in sorted(report_dir.glob("*.json")):
                  with json_file.open("r", encoding="utf-8") as f:
                      entries = json.load(f)
                  for entry in (entries if isinstance(entries, list) else []):
                      for change in entry.get("FileChanges", []):
                          issue = ET.SubElement(root, "Issue")
                          ET.SubElement(issue, "RuleId").text = change.get("DiagnosticId", "")
                          ET.SubElement(issue, "Level").text = change.get("DiagnosticSeverity", "warn")
                          ET.SubElement(issue, "Message").text = change.get("FormatDescription", "")
                          ET.SubElement(issue, "File").text = entry.get("FilePath", "")
                          ET.SubElement(issue, "Line").text = str(change.get("LineNumber", ""))
                          ET.SubElement(issue, "Column").text = str(change.get("CharNumber", ""))

          ET.ElementTree(root).write(xml_path, encoding="utf-8", xml_declaration=True)
          PY
        shell: bash
        
      - name: Upload Roslyn Analysis Report
        uses: actions/upload-artifact@v4
        with:
            name: roslyn-analysis-report
            path: ${{ github.workspace }}/roslyn-analysis.xml
            
      - name: Download Roslyn report
        uses: actions/download-artifact@v4
        with:
          name: roslyn-analysis-report
          path: report

      - name: Send Roslyn report to Sentinel
        run: |
          echo "Sending Roslyn report..."
      
          SENSOR_KEY="${{ inputs.sensorKey }}"      
          RESPONSE=$(curl -X POST "https://sentinel-api-gitops-test.apps.ocptest.andreani.com.ar/api/v1/scans/${SCAN_ID}/sensors/1/report" \
            -H "Authorization: ${TOKEN}" \
            -H "Content-Type: multipart/form-data" \
            -F "report=@report/roslyn-analysis.xml" \
            -F "isLastReport=false" \
            --connect-timeout 30 \
            --max-time 300 \
            -w "%{http_code}" \
            -o response_body.txt)
      
          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat response_body.txt
      
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Upload OK"
          else
            echo "Upload FAILED"
            exit 1
          fi
        shell: bash
        
      # ── Métricas de consumo: cloc (Count Lines of Code) ──────────────────────
      - name: Install cloc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc
        shell: bash

      - name: Run cloc – Code Metrics (.NET 8)
        run: |
          cloc . \
            --xml \
            --out="${{ github.workspace }}/cloc-report.xml" \
            --exclude-dir=bin,obj,.vs,.git,.github,TestResults,coverage-report,auditoria_resultados,packages \
            --exclude-ext=user,suo,DotSettings,nupkg \
            --not-match-f="\.(g\.cs|Designer\.cs|AssemblyInfo\.cs|gitignore|gitattributes|editorconfig|sln\.DotSettings)$" \
            --fullpath \
            --verbose=0
          echo "cloc report generated:"
          cat "${{ github.workspace }}/cloc-report.xml"
        shell: bash
        working-directory: ${{ inputs.workdir_src }}

      - name: Upload cloc Report
        uses: actions/upload-artifact@v4
        with:
          name: cloc-code-metrics-report
          path: ${{ github.workspace }}/cloc-report.xml

      - name: Download cloc report
        uses: actions/download-artifact@v4
        with:
          name: cloc-code-metrics-report
          path: cloc-report

      - name: Send cloc report to Sentinel
        run: |
          echo "Sending cloc code metrics report..."

          SENSOR_KEY="${{ inputs.sensorKey }}"
          RESPONSE=$(curl -X POST "https://sentinel-api-gitops-test.apps.ocptest.andreani.com.ar/api/v1/scans/${SCAN_ID}/sensors/1/report" \
            -H "Authorization: ${TOKEN}" \
            -H "Content-Type: multipart/form-data" \
            -F "report=@cloc-report/cloc-report.xml" \
            -F "isLastReport=true" \
            --connect-timeout 30 \
            --max-time 300 \
            -w "%{http_code}" \
            -o cloc_response_body.txt)

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat cloc_response_body.txt

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Upload OK"
          else
            echo "Upload FAILED"
            exit 1
          fi
        shell: bash
