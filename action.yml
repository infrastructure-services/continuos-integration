name: "SonarQube Analyzer .NET"
description: "Se realiza el análisis en sonarqube para NET"
inputs:
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: true
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: true
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'
  sonar_url:
    description: "url sonarqube"
    required: true
  sonar_token:
    description: "token sonarqube"
    required: true
  sonar_key:
    description: "Key del repositorio"
    required: true
  sonar_custom:
    description: "config sonar custom"
    default: ""
  dotnet-version:
    description: "versiones de dotnet"
    required: false
    default: "8.0.x"
  sentinel_url:
    description: "URL base de la API de Sentinel (sin trailing slash)"
    required: false
    default: "https://sentinel-api-gitops-test.apps.ocptest.andreani.com.ar"
  sentinel_sensor_id:
    description: "ID del sensor en Sentinel al que se reportan los análisis"
    required: false
    default: "1"
  gitops_url:
    description: "URL base de la UI de GitOps (sin trailing slash)"
    required: false
    default: "https://ui-gitops-test.apps.ocptest.andreani.com.ar"
  scan_id:
    description: "ScanId para consultar el Quality Gate en la API Sentinel"
    required: true
    default: 1

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Key Repository
      id: variables
      uses: actions/github-script@v7
      with:
        script: |
          const name = context.repo.repo
          const organization = context.repo.owner
          core.exportVariable('KEY_REPOSITORY', `${organization}_${name}`)

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup NuGet sources
      shell: bash
      env:
        NUGET_USERNAME: ${{ inputs.github_username }}
        NUGET_PASSWORD: ${{ inputs.github_token }}
      run: bash "${{ github.action_path }}/scripts/setup_nuget.sh"

    - name: Create Sentinel Scan
      id: sentinel-scan
      shell: bash
      run: |
        REPO_ID="${{ github.repository_id }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        TRIGGERED_BY="${{ github.actor }}"
        PR_NUMBER="${{ github.event.pull_request.number }}"
        PR_TITLE="${{ github.event.pull_request.title }}"

        BODY=$(jq -n \
          --arg branch        "$BRANCH" \
          --arg commitSha     "$COMMIT_SHA" \
          --arg triggeredBy   "$TRIGGERED_BY" \
          --arg prNumber      "$PR_NUMBER" \
          --arg prTitle       "$PR_TITLE" \
          '{
            branch:            $branch,
            commitSha:         $commitSha,
            pullRequestNumber: (if $prNumber == "" then null else ($prNumber | tonumber) end),
            pullRequestTitle:  (if $prTitle  == "" then null else $prTitle end),
            triggeredBy:       $triggeredBy
          }')

        echo "Request body: $BODY"

        RESPONSE=$(curl -s -X POST \
          "${{ inputs.sentinel_url }}/api/v1/repository/${REPO_ID}/scans" \
          -H "Content-Type: application/json" \
          -d "$BODY")

        echo "Sentinel response: $RESPONSE"

        SCAN_ID=$(echo "$RESPONSE" | jq -r '.scanId')
        PROJECT_ID=$(echo "$RESPONSE" | jq -r '.projectId')
        APPLICATION_ID=$(echo "$RESPONSE" | jq -r '.applicationId')
        ORGANIZATION_ID=$(echo "$RESPONSE" | jq -r '.organizationId')

        if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
          echo "ERROR: No se pudo obtener el scanId de Sentinel"
          exit 1
        fi

        # Aplicar valores por defecto si los IDs opcionales no se pudieron obtener
        if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
          echo "⚠️ No se pudo obtener projectId de Sentinel, usando valor por defecto: 0"
          PROJECT_ID="0"
        fi
        if [ -z "$APPLICATION_ID" ] || [ "$APPLICATION_ID" = "null" ]; then
          echo "⚠️ No se pudo obtener applicationId de Sentinel, usando valor por defecto: 0"
          APPLICATION_ID="0"
        fi
        if [ -z "$ORGANIZATION_ID" ] || [ "$ORGANIZATION_ID" = "null" ]; then
          echo "⚠️ No se pudo obtener organizationId de Sentinel, usando valor por defecto: 0"
          ORGANIZATION_ID="0"
        fi

        echo "SCAN_ID=${SCAN_ID}" >> $GITHUB_ENV
        echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        echo "APPLICATION_ID=${APPLICATION_ID}" >> $GITHUB_ENV
        echo "ORGANIZATION_ID=${ORGANIZATION_ID}" >> $GITHUB_ENV

        echo "scanId=${SCAN_ID}" >> $GITHUB_OUTPUT
        echo "projectId=${PROJECT_ID}" >> $GITHUB_OUTPUT
        echo "applicationId=${APPLICATION_ID}" >> $GITHUB_OUTPUT
        echo "organizationId=${ORGANIZATION_ID}" >> $GITHUB_OUTPUT

        echo "Sentinel Scan creado con ID: ${SCAN_ID}"
        echo "Project ID: ${PROJECT_ID} | Application ID: ${APPLICATION_ID} | Organization ID: ${ORGANIZATION_ID}"

    - name: Install Roslyn Analyzers
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        if [ ! -f Directory.Build.props ]; then
          cat > Directory.Build.props << 'EOF'
        <Project>
          <ItemGroup>
            <PackageReference Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="8.0.0" PrivateAssets="all" />
          </ItemGroup>
        </Project>
        EOF
        fi

    - name: Restore
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: dotnet restore

    - name: Add editorconfig
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        if [ ! -f .editorconfig ]; then
          printf "root = true\n[*]\n" > .editorconfig
        fi
        for diag in \
          "dotnet_diagnostic.CA1873.severity = none" \
          "dotnet_diagnostic.CA1707.severity = none" \
          "dotnet_diagnostic.CS1591.severity = none" \
          "dotnet_diagnostic.ORLEANS0010.severity = none"; do
          grep -qxF "$diag" .editorconfig || echo "$diag" >> .editorconfig
        done

    - name: Build
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: dotnet build --no-restore

    - name: Test 
      env:
        ASPNETCORE_ENVIRONMENT: Development
      shell: bash
      run: dotnet test --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/TestResults" --logger "trx;LogFileName=test-results.trx" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      working-directory: ${{ inputs.workdir_test }}
      continue-on-error: true

    - name: Merge Coverage Reports
      shell: bash
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool || true
        export PATH="$HOME/.dotnet/tools:$PATH"
        reportgenerator \
          "-reports:${{ github.workspace }}/TestResults/**/coverage.cobertura.xml" \
          "-targetdir:${{ github.workspace }}/TestResults/merged" \
          "-reporttypes:Cobertura" \
          "-classfilters:-WebApi.Controllers.*;-Startup;-Program;-*.Domain.Entities.*;-*Dto*;-*DependencyInjection;-*Context;-*.Infrastructure.Migrations.*;-*.Infrastructure.Persistence.Configurations.*"

    - name: Send Coverage report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "Coverlet"
        REPORT_PATH: ${{ github.workspace }}/TestResults/merged/Cobertura.xml
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Roslyn Analyzers ──────────────────────────────────────────────────────
    - name: Run Roslyn Analyzers
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        set +e
        dotnet format analyzers \
          --severity warn \
          --verify-no-changes \
          --report "${{ github.workspace }}/roslyn-report"
        EXIT_CODE=$?
        set -e

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "✅ Roslyn Analyzers: no se encontraron issues."
        elif [ "$EXIT_CODE" -eq 2 ]; then
          echo "✅ Roslyn Analyzers: se encontraron issues/warnings. Ver roslyn-report/format-report.json para el detalle."
        else
          echo "❌ Error inesperado en dotnet format analyzers (exit code: $EXIT_CODE)."
          exit "$EXIT_CODE"
        fi

    - name: Upload Roslyn Analysis Report
      uses: actions/upload-artifact@v4
      with:
        name: roslyn-analysis-report
        path: ${{ github.workspace }}/roslyn-report/format-report.json

    - name: Send Roslyn report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "roslyn"
        REPORT_PATH: ${{ github.workspace }}/roslyn-report/format-report.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Métricas de consumo: cloc (Count Lines of Code) ──────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install cloc
      shell: bash
      run: |
        if command -v apt-get &>/dev/null; then
          sudo apt-get install -y perl
        elif command -v apk &>/dev/null; then
          apk add --no-cache perl
        elif command -v yum &>/dev/null; then
          sudo yum install -y perl
        else
          echo "⚠️ No se encontró gestor de paquetes, intentando continuar..."
        fi
        npm install -g cloc

    - name: Run cloc – Code Metrics
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        cloc . \
          --json \
          --out="${{ github.workspace }}/cloc-report.json" \
          --exclude-dir=bin,obj,.vs,.git,.github,TestResults,coverage-report,roslyn-report,packages \
          --exclude-ext=user,suo,DotSettings,nupkg \
          --not-match-f="\.(g\.cs|Designer\.cs|AssemblyInfo\.cs|gitignore|gitattributes|editorconfig|sln\.DotSettings)$" \
          --fullpath \
          --verbose=0

    - name: Upload cloc Report
      uses: actions/upload-artifact@v4
      with:
        name: cloc-code-metrics-report
        path: ${{ github.workspace }}/cloc-report.json

    - name: Send cloc report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "cloc"
        REPORT_PATH: ${{ github.workspace }}/cloc-report.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Detección de código duplicado: jscpd ─────────────────────────────────
    - name: Install jscpd
      shell: bash
      run: npm install -g jscpd

    - name: Run jscpd – Duplicate Code Detection
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        jscpd . \
          --reporters "json" \
          --output "${{ github.workspace }}/jscpd-report" \
          --min-lines 5 \
          --min-tokens 50 \
          --threshold 0 \
          --ignore "**/bin/**,**/obj/**,**/.vs/**,**/.git/**,**/.github/**,**/TestResults/**,**/coverage-report/**,**/roslyn-report/**,**/packages/**,**/*.Designer.cs,**/*.g.cs,**/*.AssemblyInfo.cs" \
          --format "csharp"

    - name: Upload jscpd Report
      uses: actions/upload-artifact@v4
      with:
        name: jscpd-duplicate-code-report
        path: ${{ github.workspace }}/jscpd-report/jscpd-report.json

    - name: Send jscpd report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "jscpd"
        REPORT_PATH: ${{ github.workspace }}/jscpd-report/jscpd-report.json
        IS_LAST_REPORT: "true"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Pull Request Feedback ─────────────────────────────────────────────────
    - name: Collect Metrics
      id: metrics
      continue-on-error: true
      shell: bash
      run: |
        # ── Coverage % desde Cobertura.xml ──
        COVERAGE_FILE="${{ github.workspace }}/TestResults/merged/Cobertura.xml"
        if [ -f "$COVERAGE_FILE" ]; then
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' "$COVERAGE_FILE" | head -1)
          COVERAGE_PCT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.2f")
        else
          COVERAGE_PCT="N/A"
        fi
        echo "COVERAGE_PCT=${COVERAGE_PCT}" >> $GITHUB_ENV

        # ── Total issues Roslyn ──
        ROSLYN_FILE="${{ github.workspace }}/roslyn-report/format-report.json"
        if [ -f "$ROSLYN_FILE" ]; then
          ROSLYN_ISSUES=$(jq '[.[].FileChanges // [] | length] | add // 0' "$ROSLYN_FILE" 2>/dev/null || echo "0")
        else
          ROSLYN_ISSUES="N/A"
        fi
        echo "ROSLYN_ISSUES=${ROSLYN_ISSUES}" >> $GITHUB_ENV

        # ── Líneas duplicadas desde jscpd ──
        JSCPD_FILE="${{ github.workspace }}/jscpd-report/jscpd-report.json"
        if [ -f "$JSCPD_FILE" ]; then
          DUPLICATED_LINES=$(jq '.statistics.total.duplicatedLines // 0' "$JSCPD_FILE" 2>/dev/null || echo "0")
          DUPLICATE_PCT=$(jq '.statistics.total.percentage // 0' "$JSCPD_FILE" 2>/dev/null || echo "0")
        else
          DUPLICATED_LINES="N/A"
          DUPLICATE_PCT="N/A"
        fi
        echo "DUPLICATED_LINES=${DUPLICATED_LINES}" >> $GITHUB_ENV
        echo "DUPLICATE_PCT=${DUPLICATE_PCT}" >> $GITHUB_ENV

    - name: PullRequestFeedback
      continue-on-error: true
      shell: bash
      env:
        GITOPS_URL: ${{ inputs.gitops_url }}
        ORGANIZATION_ID: ${{ env.ORGANIZATION_ID }}
        PROJECT_ID: ${{ env.PROJECT_ID }}
        APPLICATION_ID: ${{ env.APPLICATION_ID }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        ENCODED_BRANCH=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BRANCH'))")
        URL="${GITOPS_URL}/sentinel/org/${ORGANIZATION_ID}/project/${PROJECT_ID}/application/${APPLICATION_ID}?branch=${ENCODED_BRANCH}"

        echo "## Análisis de Calidad Finalizado ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🧪 Cobertura de código | ${COVERAGE_PCT}% |" >> $GITHUB_STEP_SUMMARY
        echo "| ⚠️ Issues (Roslyn) | ${ROSLYN_ISSUES} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📋 Líneas duplicadas | ${DUPLICATED_LINES} (${DUPLICATE_PCT}%) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Puede ver los detalles completos en [GitOps](${URL})" >> $GITHUB_STEP_SUMMARY

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        GITOPS_URL: ${{ inputs.gitops_url }}
        ORGANIZATION_ID: ${{ env.ORGANIZATION_ID }}
        PROJECT_ID: ${{ env.PROJECT_ID }}
        APPLICATION_ID: ${{ env.APPLICATION_ID }}
        COVERAGE_PCT: ${{ env.COVERAGE_PCT }}
        ROSLYN_ISSUES: ${{ env.ROSLYN_ISSUES }}
        DUPLICATED_LINES: ${{ env.DUPLICATED_LINES }}
        DUPLICATE_PCT: ${{ env.DUPLICATE_PCT }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const branch = context.payload.pull_request.head.ref
          const encodedBranch = encodeURIComponent(branch)
          const url = `${process.env.GITOPS_URL}/sentinel/org/${process.env.ORGANIZATION_ID}/project/${process.env.PROJECT_ID}/application/${process.env.APPLICATION_ID}?branch=${encodedBranch}`

          const body = `## Análisis de Calidad Finalizado ✅

          | Métrica | Valor |
          |---------|-------|
          | 🧪 Cobertura de código | ${process.env.COVERAGE_PCT}% |
          | ⚠️ Issues (Roslyn) | ${process.env.ROSLYN_ISSUES} |
          | 📋 Líneas duplicadas | ${process.env.DUPLICATED_LINES} (${process.env.DUPLICATE_PCT}%) |

          Puede ver los detalles completos en [GitOps](${url})`

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          })

    - name: Validate
      shell: bash
      run: |
        REPO_ID="${{ github.repository_id }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        PR_NUMBER="${{ github.event.pull_request.number }}"

        ENCODED_BRANCH=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${BRANCH}'))")

        QUERY_PARAMS="branch=${ENCODED_BRANCH}&commitSha=${COMMIT_SHA}"
        if [ -n "$PR_NUMBER" ]; then
          QUERY_PARAMS="${QUERY_PARAMS}&pullRequestNumber=${PR_NUMBER}"
        fi

        SENTINEL_URL="${{ inputs.sentinel_url }}/api/v1/scans/repository/${REPO_ID}/validation?${QUERY_PARAMS}"

        echo "🔗 URL de validación: ${SENTINEL_URL}"

        RETRY_WAIT=5

        while true; do
          echo "🔍 Consultando Sentinel API..."

          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" -X GET "$SENTINEL_URL")

          echo "📡 HTTP Status recibido: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Quality Gate passed."
            exit 0

          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "❌ Quality Gate failed."
            echo "⛔ La API Sentinel respondió con 409: el análisis no superó el Quality Gate."
            exit 1

          elif [ "$HTTP_STATUS" -eq 204 ]; then
            echo "⏳ La API Sentinel respondió con 204 (sin resultado aún). Reintentando en ${RETRY_WAIT}s..."
            sleep $RETRY_WAIT

          else
            echo "❌ Respuesta inesperada de la API Sentinel: HTTP $HTTP_STATUS"
            echo "⛔ Se interrumpe el pipeline por error desconocido."
            exit 1
          fi
        done
