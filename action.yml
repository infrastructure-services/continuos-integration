name: Andreani Veracode DevSecOps
description: Build genérico .NET, Pipeline Scan, SARIF, gate de PR, Upload-and-Scan y policy gate.

inputs:
  workflow: 
    description: "nombre del workflow a ejecutar"
    required: true
    
  appname:
    description: Valor de APPNAME. Se combina con PROJECT para formar PROJECT_APPNAME.
    required: true

  solution:
    description: Ruta opcional de la solución. Solo es necesaria si el repositorio contiene más de una solución.
    required: false
    default: ''

  dotnet-version:
    description: SDK de respaldo cuando el repositorio no contiene global.json.
    required: false
    default: '8.0.x'

  veracode-api-id:
    description: API ID de Veracode.
    required: true

  veracode-api-key:
    description: API Key de Veracode.
    required: true

  nuget-user:
    description: Usuario opcional del feed privado de GitHub Packages.
    required: false
    default: ''

  nuget-token:
    description: Token opcional del feed privado de GitHub Packages.
    required: false
    default: ''
  
outputs:
  veracode-app-name:
    description: Nombre final de la aplicación en Veracode.
    value: ${{ steps.configuration.outputs.veracode_app_name }}

  workflow-matched:
    description: Indica si el workflow solicitado fue reconocido.
    value: ${{ steps.result.outputs.workflow_matched }}

  execution-mode:
    description: Modo de ejecución de esta acción.
    value: dummy

runs:
  using: composite

  steps:
    - name: Inicializar simulación
      id: configuration
      shell: bash
      env:
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_APPNAME: ${{ inputs.appname }}
      run: |
        set -Eeuo pipefail

        trim() {
          local value="$1"

          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"

          printf '%s' "$value"
        }

        WORKFLOW="$(trim "$INPUT_WORKFLOW")"
        PROJECT="$(trim "$INPUT_PROJECT")"
        APPNAME="$(trim "$INPUT_APPNAME")"

        if [[ -z "$WORKFLOW" ]]; then
          echo "::error::El input 'workflow' está vacío."
          exit 1
        fi

        if [[ -z "$PROJECT" ]]; then
          echo "::error::El input 'project' está vacío. Validar vars.PROJECT."
          exit 1
        fi

        if [[ -z "$APPNAME" ]]; then
          echo "::error::El input 'appname' está vacío. Validar vars.APPNAME."
          exit 1
        fi

        VERACODE_APP_NAME="${PROJECT}_${APPNAME}"

        echo "WORKFLOW_MATCHED=false" >> "$GITHUB_ENV"
        echo "DUMMY_WORKFLOW=$WORKFLOW" >> "$GITHUB_ENV"
        echo "DUMMY_VERACODE_APP_NAME=$VERACODE_APP_NAME" >> "$GITHUB_ENV"

        echo "workflow=$WORKFLOW" >> "$GITHUB_OUTPUT"
        echo "veracode_app_name=$VERACODE_APP_NAME" >> "$GITHUB_OUTPUT"

        echo "Modo dummy activo."
        echo "Workflow solicitado: $WORKFLOW"
        echo "Nombre Veracode calculado: $VERACODE_APP_NAME"

    - name: Simular Check Application
      shell: bash
      run: |
        set -Eeuo pipefail

        echo "🧪 [DUMMY] Se simularía:"
        echo "uses: infrastructure-services/continuos-integration@check-if-exists-app"
        echo "No se realizó ninguna consulta ni modificación externa."

    - name: Simular Continuous Integration .NET
      id: dotnet
      if: ${{ inputs.workflow == '.NET' }}
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution }}
        DOTNET_VERSION: ${{ inputs.dotnet-version }}

        HAS_VERACODE_API_ID: ${{ inputs.veracode-api-id != '' }}
        HAS_VERACODE_API_KEY: ${{ inputs.veracode-api-key != '' }}

        HAS_NUGET_USER: ${{ inputs.nuget-user != '' }}
        HAS_NUGET_TOKEN: ${{ inputs.nuget-token != '' }}
      run: |
        set -Eeuo pipefail

        echo "WORKFLOW_MATCHED=true" >> "$GITHUB_ENV"
        echo "workflow_matched=true" >> "$GITHUB_OUTPUT"

        if [[ -n "$SOLUTION" ]]; then
          SOLUTION_DESCRIPTION="$SOLUTION"
        else
          SOLUTION_DESCRIPTION="detección automática"
        fi

        echo "🧪 [DUMMY] Coincidencia encontrada para workflow=.NET"
        echo "🧪 [DUMMY] No se ejecutará cicdv3-net-8."
        echo "🧪 [DUMMY] Solución: $SOLUTION_DESCRIPTION"
        echo "🧪 [DUMMY] .NET: $DOTNET_VERSION"
        echo "🧪 [DUMMY] Application name: $DUMMY_VERACODE_APP_NAME"

        echo "🧪 [DUMMY] Veracode API ID configurado: $HAS_VERACODE_API_ID"
        echo "🧪 [DUMMY] Veracode API Key configurada: $HAS_VERACODE_API_KEY"

        echo "🧪 [DUMMY] NuGet user configurado: $HAS_NUGET_USER"
        echo "🧪 [DUMMY] NuGet token configurado: $HAS_NUGET_TOKEN"

        {
          echo "## 🧪 Simulación Continuous Integration .NET"
          echo
          echo "| Configuración | Valor |"
          echo "|---|---|"
          echo "| Modo | Dummy / sin efectos externos |"
          echo "| Workflow | \`.NET\` |"
          echo "| Aplicación Veracode | \`$DUMMY_VERACODE_APP_NAME\` |"
          echo "| Solución | \`$SOLUTION_DESCRIPTION\` |"
          echo "| .NET | \`$DOTNET_VERSION\` |"
          echo "| Veracode API ID informado | \`$HAS_VERACODE_API_ID\` |"
          echo "| Veracode API Key informada | \`$HAS_VERACODE_API_KEY\` |"
          echo "| NuGet user informado | \`$HAS_NUGET_USER\` |"
          echo "| NuGet token informado | \`$HAS_NUGET_TOKEN\` |"
          echo
          echo "### Acción que se ejecutaría en producción"
          echo
          echo "\`infrastructure-services/continuos-integration@cicdv3-net-8\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Validar workflow soportado
      if: ${{ env.WORKFLOW_MATCHED != 'true' }}
      shell: bash
      env:
        FAIL_ON_UNSUPPORTED: ${{ inputs.fail-on-unsupported-workflow }}
      run: |
        set -Eeuo pipefail

        {
          echo "## ⚠️ Workflow no reconocido"
          echo
          echo "El valor recibido fue: \`$DUMMY_WORKFLOW\`"
          echo
          echo "Workflows soportados actualmente:"
          echo
          echo "- \`.NET\`"
        } >> "$GITHUB_STEP_SUMMARY"

        if [[ "$FAIL_ON_UNSUPPORTED" == "true" ]]; then
          echo "::error::Workflow no soportado: '$DUMMY_WORKFLOW'."
          exit 1
        fi

        echo "::warning::Workflow no soportado: '$DUMMY_WORKFLOW'."

    - name: Publicar resultado dummy
      id: result
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail

        MATCHED="${WORKFLOW_MATCHED:-false}"

        echo "workflow_matched=$MATCHED" >> "$GITHUB_OUTPUT"

        echo "Resultado dummy:"
        echo "  workflow=$DUMMY_WORKFLOW"
        echo "  workflow_matched=$MATCHED"
        echo "  veracode_app_name=$DUMMY_VERACODE_APP_NAME"