name: "Architecture Code Analyzer .NET"
description: "Se realiza el análisis de código para NET"
inputs:
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: true
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: true
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'
  dotnet-version:
    description: "versiones de dotnet"
    required: false
    default: "8.0.x"
  sentinel_url:
    description: "URL base de la API de Sentinel (sin trailing slash)"
    required: false
    default: "https://github-integration-gitops-prod.apps.andreani.com.ar"
  sentinel_sensor_id:
    description: "ID del sensor en Sentinel al que se reportan los análisis"
    required: false
    default: "1"
  gitops_url:
    description: "URL base de la UI de GitOps (sin trailing slash)"
    required: false
    default: "https://ui-gitops-test.apps.ocptest.andreani.com.ar"
  scan_id:
    description: "ScanId para consultar el Quality Gate en la API Sentinel"
    required: true
    default: 1
  netanalyzers_version:
    description: "Versión del paquete Microsoft.CodeAnalysis.NetAnalyzers"
    required: false
    default: "8.0.0"
  sonaranalyzer_version:
    description: "Versión del paquete SonarAnalyzer.CSharp (reglas S####)"
    required: false
    default: "9.32.0.97167"
  enable_sonar:
    description: "Habilita el sensor sonar (SonarAnalyzer.CSharp). 'true' | 'false'"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Key Repository
      id: variables
      uses: actions/github-script@v8
      with:
        script: |
          const name = context.repo.repo
          const organization = context.repo.owner
          core.exportVariable('KEY_REPOSITORY', `${organization}_${name}`)

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup NuGet sources
      shell: bash
      env:
        NUGET_USERNAME: ${{ inputs.github_username }}
        NUGET_PASSWORD: ${{ inputs.github_token }}
      run: bash "${{ github.action_path }}/scripts/setup_nuget.sh"

    - name: Create Sentinel Scan
      id: sentinel-scan
      shell: bash
      run: |
        REPO_ID="${{ github.repository_id }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        TRIGGERED_BY="${{ github.actor }}"
        PR_NUMBER="${{ github.event.pull_request.number }}"
        PR_TITLE="${{ github.event.pull_request.title }}"

        BODY=$(jq -n \
          --arg branch        "$BRANCH" \
          --arg commitSha     "$COMMIT_SHA" \
          --arg triggeredBy   "$TRIGGERED_BY" \
          --arg prNumber      "$PR_NUMBER" \
          --arg prTitle       "$PR_TITLE" \
          '{
            branch:            $branch,
            commitSha:         $commitSha,
            pullRequestNumber: (if $prNumber == "" then null else ($prNumber | tonumber) end),
            pullRequestTitle:  (if $prTitle  == "" then null else $prTitle end),
            triggeredBy:       $triggeredBy
          }')

        echo "Request body: $BODY"

        RESPONSE=$(curl -s -X POST \
          "${{ inputs.sentinel_url }}/api/v1/repository/${REPO_ID}/scans" \
          -H "Content-Type: application/json" \
          -d "$BODY")

        echo "Sentinel response: $RESPONSE"

        SCAN_ID=$(echo "$RESPONSE" | jq -r '.scanId')
        PROJECT_ID=$(echo "$RESPONSE" | jq -r '.projectId')
        APPLICATION_ID=$(echo "$RESPONSE" | jq -r '.applicationId')
        ORGANIZATION_ID=$(echo "$RESPONSE" | jq -r '.organizationId')

        if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
          echo "ERROR: No se pudo obtener el scanId de Sentinel"
          exit 1
        fi

        # Aplicar valores por defecto si los IDs opcionales no se pudieron obtener
        if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
          echo "⚠️ No se pudo obtener projectId de Sentinel, usando valor por defecto: 0"
          PROJECT_ID="0"
        fi
        if [ -z "$APPLICATION_ID" ] || [ "$APPLICATION_ID" = "null" ]; then
          echo "⚠️ No se pudo obtener applicationId de Sentinel, usando valor por defecto: 0"
          APPLICATION_ID="0"
        fi
        if [ -z "$ORGANIZATION_ID" ] || [ "$ORGANIZATION_ID" = "null" ]; then
          echo "⚠️ No se pudo obtener organizationId de Sentinel, usando valor por defecto: 0"
          ORGANIZATION_ID="0"
        fi

        echo "SCAN_ID=${SCAN_ID}" >> $GITHUB_ENV
        echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        echo "APPLICATION_ID=${APPLICATION_ID}" >> $GITHUB_ENV
        echo "ORGANIZATION_ID=${ORGANIZATION_ID}" >> $GITHUB_ENV

        echo "scanId=${SCAN_ID}" >> $GITHUB_OUTPUT
        echo "projectId=${PROJECT_ID}" >> $GITHUB_OUTPUT
        echo "applicationId=${APPLICATION_ID}" >> $GITHUB_OUTPUT
        echo "organizationId=${ORGANIZATION_ID}" >> $GITHUB_OUTPUT

        echo "Sentinel Scan creado con ID: ${SCAN_ID}"
        echo "Project ID: ${PROJECT_ID} | Application ID: ${APPLICATION_ID} | Organization ID: ${ORGANIZATION_ID}"

    # ── Inyección de analyzers (Roslyn/NetAnalyzers + SonarAnalyzer) ─────────
    # Se usa Directory.Build.targets (no .props) porque se importa DESPUÉS del
    # proyecto: gana sobre cualquier configuración propia del repo y no se
    # saltea la inyección en repos que ya tienen un Directory.Build.props.
    - name: Inject Analyzers (Roslyn + Sonar)
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      env:
        NETANALYZERS_VERSION: ${{ inputs.netanalyzers_version }}
        SONARANALYZER_VERSION: ${{ inputs.sonaranalyzer_version }}
        ENABLE_SONAR: ${{ inputs.enable_sonar }}
      run: |
        SARIF_DIR="${{ github.workspace }}/sarif"
        rm -rf "$SARIF_DIR" && mkdir -p "$SARIF_DIR"
        echo "SARIF_OUTPUT_DIR=${SARIF_DIR}" >> $GITHUB_ENV
        export SARIF_OUTPUT_DIR="$SARIF_DIR"

        IMPORT_ORIGINAL=""
        if [ -f Directory.Build.targets ]; then
          echo "ℹ️ El repo ya tiene Directory.Build.targets: se preserva como Sentinel.Original.Build.targets y se importa."
          mv Directory.Build.targets Sentinel.Original.Build.targets
          IMPORT_ORIGINAL='  <Import Project="$(MSBuildThisFileDirectory)Sentinel.Original.Build.targets" />'
        fi

        SONAR_REF=""
        if [ "${ENABLE_SONAR}" = "true" ]; then
          SONAR_REF="    <PackageReference Remove=\"SonarAnalyzer.CSharp\" />
            <PackageReference Include=\"SonarAnalyzer.CSharp\" PrivateAssets=\"all\">
              <Version Condition=\"'\$(ManagePackageVersionsCentrally)' != 'true'\">${SONARANALYZER_VERSION}</Version>
            </PackageReference>
            <PackageVersion Remove=\"SonarAnalyzer.CSharp\" Condition=\"'\$(ManagePackageVersionsCentrally)' == 'true'\" />
            <PackageVersion Include=\"SonarAnalyzer.CSharp\" Version=\"${SONARANALYZER_VERSION}\" Condition=\"'\$(ManagePackageVersionsCentrally)' == 'true'\" />"
          echo "✅ Sensor sonar habilitado (SonarAnalyzer.CSharp ${SONARANALYZER_VERSION})."
        else
          echo "⏭️ Sensor sonar deshabilitado por input enable_sonar=false."
        fi

        cat > Directory.Build.targets << EOF
        <Project>
        ${IMPORT_ORIGINAL}
          <PropertyGroup>
            <!-- Los analyzers sólo reportan: nunca deben romper el build. -->
            <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
            <MSBuildTreatWarningsAsErrors>false</MSBuildTreatWarningsAsErrors>
            <WarningsAsErrors></WarningsAsErrors>
            <EnableNETAnalyzers>true</EnableNETAnalyzers>
            <EnforceCodeStyleInBuild>true</EnforceCodeStyleInBuild>
            <AnalysisLevel>latest</AnalysisLevel>
            <AnalysisMode>Default</AnalysisMode>
            <!--
              ErrorLog emite SARIF 2.1 con TODOS los diagnósticos de la pasada de build
              (a diferencia de 'dotnet format analyzers', que sólo reporta los que tienen
              code fix aplicable y por eso dejaba afuera la mayoría de las reglas Sonar).
              El archivo es por proyecto+TFM: en soluciones multi-proyecto uno solo se pisa.
            -->
            <ErrorLog Condition="'\$(SARIF_OUTPUT_DIR)' != ''">\$(SARIF_OUTPUT_DIR)/\$(MSBuildProjectName).\$(TargetFramework).sarif,version=2.1</ErrorLog>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Remove="Microsoft.CodeAnalysis.NetAnalyzers" />
            <PackageReference Include="Microsoft.CodeAnalysis.NetAnalyzers" PrivateAssets="all">
              <Version Condition="'\$(ManagePackageVersionsCentrally)' != 'true'">${NETANALYZERS_VERSION}</Version>
            </PackageReference>
            <PackageVersion Remove="Microsoft.CodeAnalysis.NetAnalyzers" Condition="'\$(ManagePackageVersionsCentrally)' == 'true'" />
            <PackageVersion Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="${NETANALYZERS_VERSION}" Condition="'\$(ManagePackageVersionsCentrally)' == 'true'" />
        ${SONAR_REF}
          </ItemGroup>
        </Project>
        EOF

        echo "── Directory.Build.targets generado ──"
        cat Directory.Build.targets

    - name: Restore
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: dotnet restore

    - name: Add editorconfig
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        if [ ! -f .editorconfig ]; then
          printf "root = true\n[*]\n" > .editorconfig
        fi
        for diag in \
          "dotnet_diagnostic.CA1873.severity = none" \
          "dotnet_diagnostic.CA1707.severity = none" \
          "dotnet_diagnostic.CS1591.severity = none" \
          "dotnet_diagnostic.ORLEANS0010.severity = none"; do
          grep -qxF "$diag" .editorconfig || echo "$diag" >> .editorconfig
        done

    - name: Build
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: dotnet build --no-restore

    - name: Ensure coverlet.collector is referenced
      shell: bash
      working-directory: ${{ inputs.workdir_test }}
      run: |
        for proj in $(find . -name "*.csproj" -path "*est*"); do
          if ! grep -q "coverlet.collector" "$proj"; then
            echo "⚠️ coverlet.collector no encontrado en $proj, agregando..."
            dotnet add "$proj" package coverlet.collector
          else
            echo "✅ coverlet.collector ya referenciado en $proj"
          fi
        done

    - name: Test 
      env:
        ASPNETCORE_ENVIRONMENT: Development
      shell: bash
      run: >
        dotnet test
        --collect:"XPlat Code Coverage"
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=cobertura
        /p:CoverletOutput="TestResults/coverlet/"
        --logger "trx;LogFileName=test-results.trx"
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      working-directory: ${{ inputs.workdir_test }}
      continue-on-error: true

    - name: Merge Coverage Reports
      shell: bash
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool || true
        export PATH="$HOME/.dotnet/tools:$PATH"
        reportgenerator \
          "-reports:${{ inputs.workdir_test }}/**/coverage.cobertura.xml" \
          "-targetdir:${{ github.workspace }}/TestResults/merged" \
          "-reporttypes:Cobertura" \
          "-classfilters:-*.Controllers.*;-Startup;-Program;-*.Domain.Entities.*;-*Dto*;-*DependencyInjection;-*Context;-*.Infrastructure.Migrations.*;-*.Infrastructure.Persistence.Configurations.*" \
          "-filefilters:-**/obj/**/*.cs;-**/bin/**/*.cs"

    - name: Send Coverage report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "Coverlet"
        REPORT_PATH: ${{ github.workspace }}/TestResults/merged/Cobertura.xml
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Análisis estático: partición del SARIF del build ─────────────────────
    # El build ya emitió un SARIF por proyecto vía la propiedad ErrorLog.
    # Se consolidan y se parten por prefijo de regla:
    #   ^S[0-9]+$  → sensor "sonar"   (SonarAnalyzer.CSharp)
    #   el resto   → sensor "roslyn"  (CA###/IDE###/CS### y analyzers de terceros)
    # Partir por prefijo evita el solapamiento sin necesidad de dedupe posterior.
    - name: Split SARIF by analyzer (roslyn / sonar)
      id: sarif
      shell: bash
      run: |
        SARIF_DIR="${{ github.workspace }}/sarif"
        ROSLYN_OUT="${{ github.workspace }}/roslyn-report"
        SONAR_OUT="${{ github.workspace }}/sonar-report"
        mkdir -p "$ROSLYN_OUT" "$SONAR_OUT"

        mapfile -t FILES < <(find "$SARIF_DIR" -name '*.sarif' -type f 2>/dev/null)
        echo "SARIF encontrados: ${#FILES[@]}"
        printf '  %s\n' "${FILES[@]}"

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "⚠️ No se generó ningún SARIF. ¿El build corrió con SARIF_OUTPUT_DIR seteado?"
          echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"none"}},"results":[]}]}' > "$ROSLYN_OUT/roslyn.sarif"
          cp "$ROSLYN_OUT/roslyn.sarif" "$SONAR_OUT/sonar.sarif"
          echo '[]' > "$ROSLYN_OUT/roslyn.json"
          echo '[]' > "$SONAR_OUT/sonar.json"
          echo "roslyn_issues=0" >> $GITHUB_OUTPUT
          echo "sonar_issues=0" >> $GITHUB_OUTPUT
          exit 0
        fi

        # $sonar == true  → se queda con las reglas S####
        # $sonar == false → se queda con todo lo demás
        SPLIT='
          def key: [ (.ruleId // ""),
                     (.locations[0].physicalLocation.artifactLocation.uri // ""),
                     (.locations[0].physicalLocation.region.startLine // 0),
                     (.locations[0].physicalLocation.region.startColumn // 0),
                     (.message.text // "") ];
          def isSonar: (.ruleId // "") | test("^S[0-9]+$");
          # Equivalente a `dotnet format analyzers --severity warn` (versión productiva):
          # sólo warning/error y sin diagnósticos suprimidos en código (#pragma / SuppressMessage).
          def isReportable: ((.level // "warning") | IN("warning", "error"))
                            and ((.suppressions // []) | length == 0);
          [ .[] | .runs[]? ] as $runs
          | ( [ $runs[] | .results[]? ]
              | map(select(isReportable))
              | map(select(if $sonar then isSonar else (isSonar | not) end))
              | unique_by(key) ) as $results
          | ( [ $runs[] | .tool.driver.rules[]? ]
              | map(select(((.id // "") | test("^S[0-9]+$")) == $sonar))
              | unique_by(.id) ) as $rules
          | {
              version: "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              runs: [ { tool: { driver: { name: $name, rules: $rules } }, results: $results } ]
            }'

        jq -s --arg name "roslyn" --argjson sonar false "$SPLIT" "${FILES[@]}" > "$ROSLYN_OUT/roslyn.sarif"
        jq -s --arg name "sonar"  --argjson sonar true  "$SPLIT" "${FILES[@]}" > "$SONAR_OUT/sonar.sarif"

        # Sentinel consume el formato JSON de `dotnet format --report`
        # (array por archivo con FileChanges[]), no SARIF.
        TO_JSON='
          [ .runs[]?.results[]?
            | (.locations[0].physicalLocation // {}) as $loc
            | {
                path: (($loc.artifactLocation.uri // "") | sub("^file://"; "")),
                change: {
                  LineNumber:        ($loc.region.startLine // 0),
                  CharNumber:        ($loc.region.startColumn // 0),
                  DiagnosticId:      (.ruleId // ""),
                  FormatDescription: "\(.level // "warning") \(.ruleId // ""): \(.message.text // "")"
                }
              } ]
          | group_by(.path)
          | map({
              FileName:    (.[0].path | split("/") | last),
              FilePath:    .[0].path,
              FileChanges: map(.change)
            })'

        jq "$TO_JSON" "$ROSLYN_OUT/roslyn.sarif" > "$ROSLYN_OUT/roslyn.json"
        jq "$TO_JSON" "$SONAR_OUT/sonar.sarif"   > "$SONAR_OUT/sonar.json"

        ROSLYN_ISSUES=$(jq '[.runs[].results[]] | length' "$ROSLYN_OUT/roslyn.sarif")
        SONAR_ISSUES=$(jq  '[.runs[].results[]] | length' "$SONAR_OUT/sonar.sarif")

        echo "✅ Roslyn: ${ROSLYN_ISSUES} findings → $ROSLYN_OUT/roslyn.sarif"
        echo "✅ Sonar : ${SONAR_ISSUES} findings → $SONAR_OUT/sonar.sarif"

        echo "── Top reglas Roslyn ──"
        jq -r '[.runs[].results[].ruleId] | group_by(.) | map({rule: .[0], count: length})
               | sort_by(-.count) | .[:15][] | "  \(.count)\t\(.rule)"' "$ROSLYN_OUT/roslyn.sarif"
        echo "── Top reglas Sonar ──"
        jq -r '[.runs[].results[].ruleId] | group_by(.) | map({rule: .[0], count: length})
               | sort_by(-.count) | .[:15][] | "  \(.count)\t\(.rule)"' "$SONAR_OUT/sonar.sarif"

        echo "roslyn_issues=${ROSLYN_ISSUES}" >> $GITHUB_OUTPUT
        echo "sonar_issues=${SONAR_ISSUES}" >> $GITHUB_OUTPUT

    - name: Upload SARIF reports
      uses: actions/upload-artifact@v6
      with:
        name: static-analysis-sarif
        path: |
          ${{ github.workspace }}/roslyn-report/roslyn.sarif
          ${{ github.workspace }}/roslyn-report/roslyn.json
          ${{ github.workspace }}/sonar-report/sonar.sarif
          ${{ github.workspace }}/sonar-report/sonar.json

    - name: Send Roslyn report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "roslyn"
        REPORT_PATH: ${{ github.workspace }}/roslyn-report/roslyn.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    - name: Send Sonar report to Sentinel
      if: ${{ inputs.enable_sonar == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "sonar"
        REPORT_PATH: ${{ github.workspace }}/sonar-report/sonar.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Métricas de consumo: cloc (Count Lines of Code) ──────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Install cloc
      shell: bash
      run: |
        if command -v apt-get &>/dev/null; then
          sudo apt-get install -y perl
        elif command -v apk &>/dev/null; then
          apk add --no-cache perl
        elif command -v yum &>/dev/null; then
          sudo yum install -y perl
        else
          echo "⚠️ No se encontró gestor de paquetes, intentando continuar..."
        fi
        npm install -g cloc

    - name: Run cloc – Code Metrics
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        cloc . \
          --json \
          --out="${{ github.workspace }}/cloc-report.json" \
          --exclude-dir=bin,obj,.vs,.git,.github,TestResults,coverage-report,roslyn-report,sonar-report,sarif,packages \
          --exclude-ext=user,suo,DotSettings,nupkg \
          --not-match-f="\.(g\.cs|Designer\.cs|AssemblyInfo\.cs|gitignore|gitattributes|editorconfig|sln\.DotSettings)$" \
          --fullpath \
          --verbose=0

    - name: Upload cloc Report
      uses: actions/upload-artifact@v6
      with:
        name: cloc-code-metrics-report
        path: ${{ github.workspace }}/cloc-report.json

    - name: Send cloc report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "cloc"
        REPORT_PATH: ${{ github.workspace }}/cloc-report.json
        IS_LAST_REPORT: "false"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Detección de código duplicado: jscpd ─────────────────────────────────
    - name: Install jscpd
      shell: bash
      run: |
        npm install -g jscpd@4.2.1 --include=optional



    - name: Run jscpd – Duplicate Code Detection
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.workdir_src }}
      run: |
        jscpd . \
          --reporters "json" \
          --output "${{ github.workspace }}/jscpd-report" \
          --min-lines 10 \
          --min-tokens 100 \
          --threshold 10 \
          --ignore "**/bin/**,**/obj/**,**/.vs/**,**/.git/**,**/.github/**,**/TestResults/**,**/coverage-report/**,**/roslyn-report/**,**/packages/**,**/*.Designer.cs,**/*.g.cs,**/*.AssemblyInfo.cs" \
          --ignore-pattern "(?:^|\n)\s*(global\s+)?using\s+[^;]+;\s*(?=$|\n)" \
          --format "csharp"

    - name: Upload jscpd Report
      uses: actions/upload-artifact@v6
      with:
        name: jscpd-duplicate-code-report
        path: ${{ github.workspace }}/jscpd-report/jscpd-report.json

    - name: Send jscpd report to Sentinel
      continue-on-error: true
      shell: bash
      env:
        SENTINEL_URL: ${{ inputs.sentinel_url }}
        SCAN_ID: ${{ env.SCAN_ID }}
        SENSOR_ID: "jscpd"
        REPORT_PATH: ${{ github.workspace }}/jscpd-report/jscpd-report.json
        IS_LAST_REPORT: "true"
      run: bash "${{ github.action_path }}/scripts/send_to_sentinel.sh"

    # ── Pull Request Feedback ─────────────────────────────────────────────────
    - name: Collect Metrics
      id: metrics
      continue-on-error: true
      shell: bash
      run: |
        # ── Coverage % desde Cobertura.xml ──
        COVERAGE_FILE="${{ github.workspace }}/TestResults/merged/Cobertura.xml"
        if [ -f "$COVERAGE_FILE" ]; then
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' "$COVERAGE_FILE" | head -1)
          COVERAGE_PCT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.2f")
        else
          COVERAGE_PCT="N/A"
        fi
        echo "COVERAGE_PCT=${COVERAGE_PCT}" >> $GITHUB_ENV

        # ── Total issues Roslyn (CA/IDE/CS) ──
        ROSLYN_FILE="${{ github.workspace }}/roslyn-report/roslyn.sarif"
        if [ -f "$ROSLYN_FILE" ]; then
          ROSLYN_ISSUES=$(jq '[.runs[].results[]] | length' "$ROSLYN_FILE" 2>/dev/null || echo "0")
        else
          ROSLYN_ISSUES="N/A"
        fi
        echo "ROSLYN_ISSUES=${ROSLYN_ISSUES}" >> $GITHUB_ENV

        # ── Total issues Sonar (S####) ──
        SONAR_FILE="${{ github.workspace }}/sonar-report/sonar.sarif"
        if [ -f "$SONAR_FILE" ]; then
          SONAR_ISSUES=$(jq '[.runs[].results[]] | length' "$SONAR_FILE" 2>/dev/null || echo "0")
        else
          SONAR_ISSUES="N/A"
        fi
        echo "SONAR_ISSUES=${SONAR_ISSUES}" >> $GITHUB_ENV

        # ── Líneas duplicadas desde jscpd ──
        JSCPD_FILE="${{ github.workspace }}/jscpd-report/jscpd-report.json"
        if [ -f "$JSCPD_FILE" ]; then
          DUPLICATED_LINES=$(jq '.statistics.total.duplicatedLines // 0' "$JSCPD_FILE" 2>/dev/null || echo "0")
          DUPLICATE_PCT=$(jq '.statistics.total.percentage // 0' "$JSCPD_FILE" 2>/dev/null || echo "0")
        else
          DUPLICATED_LINES="N/A"
          DUPLICATE_PCT="N/A"
        fi
        echo "DUPLICATED_LINES=${DUPLICATED_LINES}" >> $GITHUB_ENV
        echo "DUPLICATE_PCT=${DUPLICATE_PCT}" >> $GITHUB_ENV

    - name: PullRequestFeedback
      continue-on-error: true
      shell: bash
      env:
        GITOPS_URL: ${{ inputs.gitops_url }}
        ORGANIZATION_ID: ${{ env.ORGANIZATION_ID }}
        PROJECT_ID: ${{ env.PROJECT_ID }}
        APPLICATION_ID: ${{ env.APPLICATION_ID }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        ENCODED_BRANCH=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BRANCH'))")
        URL="${GITOPS_URL}/sentinel/org/${ORGANIZATION_ID}/project/${PROJECT_ID}/application/${APPLICATION_ID}?branch=${ENCODED_BRANCH}"

        echo "## Análisis de Calidad Finalizado ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🧪 Cobertura de código | ${COVERAGE_PCT}% |" >> $GITHUB_STEP_SUMMARY
        echo "| ⚠️ Issues (Roslyn) | ${ROSLYN_ISSUES} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔎 Issues (Sonar) | ${SONAR_ISSUES} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📋 Líneas duplicadas | ${DUPLICATED_LINES} (${DUPLICATE_PCT}%) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Puede ver los detalles completos en [GitOps](${URL})" >> $GITHUB_STEP_SUMMARY

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        GITOPS_URL: ${{ inputs.gitops_url }}
        ORGANIZATION_ID: ${{ env.ORGANIZATION_ID }}
        PROJECT_ID: ${{ env.PROJECT_ID }}
        APPLICATION_ID: ${{ env.APPLICATION_ID }}
        COVERAGE_PCT: ${{ env.COVERAGE_PCT }}
        ROSLYN_ISSUES: ${{ env.ROSLYN_ISSUES }}
        SONAR_ISSUES: ${{ env.SONAR_ISSUES }}
        DUPLICATED_LINES: ${{ env.DUPLICATED_LINES }}
        DUPLICATE_PCT: ${{ env.DUPLICATE_PCT }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const branch = context.payload.pull_request.head.ref
          const encodedBranch = encodeURIComponent(branch)
          const url = `${process.env.GITOPS_URL}/sentinel/org/${process.env.ORGANIZATION_ID}/project/${process.env.PROJECT_ID}/application/${process.env.APPLICATION_ID}?branch=${encodedBranch}`

          const body = `## Análisis de Calidad Finalizado ✅

          | Métrica | Valor |
          |---------|-------|
          | 🧪 Cobertura de código | ${process.env.COVERAGE_PCT}% |
          | ⚠️ Issues (Roslyn) | ${process.env.ROSLYN_ISSUES} |
          | 🔎 Issues (Sonar) | ${process.env.SONAR_ISSUES} |
          | 📋 Líneas duplicadas | ${process.env.DUPLICATED_LINES} (${process.env.DUPLICATE_PCT}%) |

          Puede ver los detalles completos en [GitOps](${url})`

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          })
