name: Andreani Veracode DevSecOps
description: Veracode Autopackager para .NET, Pipeline Scan (SAST), Policy Scan, SCA, SARIF, gate de PR, PR comment y Job Summary.

inputs:
  project:
    description: Prefijo del proyecto. Se combina con appname para formar el nombre de la aplicación en Veracode.
    required: true

  appname:
    description: Nombre de la aplicación.
    required: true

  workflow:
    description: "Workflow a ejecutar. Valores soportados: '.NET', '.NET 6', '.NET 8', '.NET 10'."
    required: true

  veracode-api-id:
    description: API ID de Veracode.
    required: true

  veracode-api-key:
    description: API Key de Veracode.
    required: true

  srcclr-api-token:
    description: Token SRCCLR de Veracode para el análisis SCA.
    required: false
    default: ''

  github_token:
    description: Token para NuGet, issues, comentarios de PR y artifacts.
    required: true

  solution:
    description: Input legacy. Se conserva por compatibilidad; Veracode Autopackager detecta los proyectos automáticamente.
    required: false
    default: ''

  dotnet-version:
    description: Versión explícita del SDK .NET disponible para Autopackager. Si queda vacío, se determina desde workflow.
    required: false
    default: ''

  nuget-feed-url:
    description: URL del feed privado de NuGet.
    required: false
    default: 'https://nuget.pkg.github.com/architecture-it/index.json'

  first-party-prefix:
    description: Input legacy. Se conserva por compatibilidad; Autopackager decide qué artefactos generar.
    required: false
    default: ''

  fail-on-severity:
    description: Severidades que bloquean el merge en Pipeline Scan.
    required: false
    default: 'Very High'

  scan-timeout:
    description: Tiempo máximo, en minutos, que Pipeline Scan espera al backend.
    required: false
    default: '45'

  sca-report-url:
    description: URL opcional del reporte de Veracode SCA.
    required: false
    default: ''
    
  veracode-team:
    description: Veracode team
    required: false
    default: ''
    

outputs:
  veracode-app-name:
    description: Nombre final de la aplicación en Veracode.
    value: ${{ steps.configuration.outputs.veracode_app_name }}

  workflow-matched:
    description: Indica si el workflow solicitado fue reconocido.
    value: ${{ steps.result.outputs.workflow_matched }}

runs:
  using: composite

  steps:

    # ── CONFIGURACIÓN ──────────────────────────────────────────

    - name: Configuración inicial
      id: configuration
      shell: bash
      env:
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_APPNAME: ${{ inputs.appname }}
      run: |
        set -Eeuo pipefail

        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        WORKFLOW="$(trim "$INPUT_WORKFLOW")"
        PROJECT="$(trim "$INPUT_PROJECT")"
        APPNAME="$(trim "$INPUT_APPNAME")"

        [[ -n "$WORKFLOW" ]] || {
          echo "::error::El input 'workflow' está vacío."
          exit 1
        }

        [[ -n "$PROJECT" ]] || {
          echo "::error::El input 'project' está vacío."
          exit 1
        }

        [[ -n "$APPNAME" ]] || {
          echo "::error::El input 'appname' está vacío."
          exit 1
        }
        IS_DOTNET="false"

        case "$WORKFLOW" in
          ".NET"|".NET 6"|".NET 8"|".NET 10")
            IS_DOTNET="true"
            ;;
        esac

        VERACODE_APP_NAME="${PROJECT}_${APPNAME}"

        echo "veracode_app_name=$VERACODE_APP_NAME" >> "$GITHUB_OUTPUT"
        echo "workflow=$WORKFLOW" >> "$GITHUB_OUTPUT"
        echo "is_dotnet=$IS_DOTNET" >> "$GITHUB_OUTPUT"

        echo "Workflow solicitado : $WORKFLOW"
        echo "App name Veracode   : $VERACODE_APP_NAME"
        echo "Es workflow .NET    : $IS_DOTNET"

    # ── SDK Y VERACODE AUTOPACKAGER ────────────────────────────

    # Setup .NET solamente garantiza que el SDK requerido exista en el runner.
    # El action NO ejecuta restore/build/publish: esas tareas quedan a cargo
    # de `veracode package`.

    - name: Seleccionar versión de .NET
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      id: dotnet
      shell: bash
      env:
        INPUT_DOTNET_VERSION: ${{ inputs.dotnet-version }}
        WORKFLOW: ${{ steps.configuration.outputs.workflow }}
      run: |
        set -Eeuo pipefail

        if [[ -n "$INPUT_DOTNET_VERSION" ]]; then
          DOTNET_VERSION="$INPUT_DOTNET_VERSION"
        else
          case "$WORKFLOW" in
            ".NET 6")
              DOTNET_VERSION="6.0.x"
              ;;
            ".NET 8")
              DOTNET_VERSION="8.0.x"
              ;;
            ".NET 10")
              DOTNET_VERSION="10.0.x"
              ;;
            ".NET")
              # Mantiene el comportamiento histórico del action genérico.
              DOTNET_VERSION="8.0.x"
              ;;
            *)
              echo "::error::Workflow .NET no reconocido: $WORKFLOW"
              exit 1
              ;;
          esac
        fi

        echo "dotnet_version=$DOTNET_VERSION" >> "$GITHUB_OUTPUT"
        echo "SDK disponible para Autopackager: $DOTNET_VERSION"

    - name: Setup .NET
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ steps.dotnet.outputs.dotnet_version }}
        source-url: ${{ inputs.nuget-feed-url }}
      env:
        NUGET_AUTH_TOKEN: ${{ inputs.github_token }}

    - name: Mostrar toolchain .NET
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        dotnet --info

    - name: Cache NuGet
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.vbproj', '**/*.sln', '**/*.slnx', '**/global.json', '**/Directory.Packages.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Instalar Veracode CLI
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail

        echo "[INFO] Instalando Veracode CLI..."
        rm -f ./veracode

        curl --fail --silent --show-error --location \
          https://tools.veracode.com/veracode-cli/install \
          | sh

        [[ -x ./veracode ]] || {
          echo "::error::No se encontró el ejecutable ./veracode después de la instalación."
          exit 1
        }

        echo "[INFO] Versión de Veracode CLI:"
        ./veracode version

    - name: Veracode Package Discover
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      shell: bash
      env:
        VERACODE_API_KEY_ID: ${{ inputs.veracode-api-id }}
        VERACODE_API_KEY_SECRET: ${{ inputs.veracode-api-key }}
      run: |
        set -Eeuo pipefail

        echo "[INFO] Detectando proyectos y toolchains .NET..."
        ./veracode package discover . --verbose

        if [[ -f veracode.yml ]]; then
          echo "[INFO] veracode.yml generado por Package Discover:"
          cat veracode.yml
        else
          echo "::warning::Package Discover no generó veracode.yml."
        fi

    - name: Veracode Autopackage
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      id: package
      shell: bash
      env:
        VERACODE_API_KEY_ID: ${{ inputs.veracode-api-id }}
        VERACODE_API_KEY_SECRET: ${{ inputs.veracode-api-key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -Eeuo pipefail

        echo "[INFO] Ejecutando Veracode Autopackager..."

        rm -rf dist
        mkdir -p dist

        ./veracode package \
          --source . \
          --trust \
          --strict \
          --output ./dist \
          --verbose

        echo "[INFO] Artefactos generados por Autopackager:"
        find dist -maxdepth 2 -type f -printf '%p\n' | sort

        mapfile -t PACKAGE_CANDIDATES < <(
          find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f \
            \( -name '*dotnet.zip' -o -name '*msvc.zip' \) \
            | sort
        )

        if [[ "${#PACKAGE_CANDIDATES[@]}" -eq 0 ]]; then
          mapfile -t PACKAGE_CANDIDATES < <(
            find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.zip' \
              ! -name '*-js.zip' \
              | sort
          )
        fi

        if [[ "${#PACKAGE_CANDIDATES[@]}" -eq 0 ]]; then
          echo "::error::Veracode Autopackager no generó ningún ZIP .NET escaneable."
          exit 1
        fi

        PACKAGE_PATH="${PACKAGE_CANDIDATES[0]}"

        if [[ "${#PACKAGE_CANDIDATES[@]}" -gt 1 ]]; then
          echo "::warning::Autopackager generó múltiples ZIP candidatos. Pipeline Scan utilizará el primero:"
          printf '  - %s\n' "${PACKAGE_CANDIDATES[@]}"
        fi

        # Policy Scan sí puede recibir un directorio. Copiamos únicamente los
        # artefactos .NET seleccionados para evitar subir paquetes auxiliares,
        # por ejemplo un *-js.zip generado por Autopackager.
        rm -rf dist-policy
        mkdir -p dist-policy

        for artifact in "${PACKAGE_CANDIDATES[@]}"; do
          cp "$artifact" dist-policy/
        done

        echo "[INFO] Artefacto seleccionado para Pipeline Scan: $PACKAGE_PATH"
        echo "[INFO] Artefactos enviados a Policy Scan:"
        find dist-policy -maxdepth 1 -type f -printf '%p\n' | sort

        echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
        echo "package_directory=$GITHUB_WORKSPACE/dist-policy" >> "$GITHUB_OUTPUT"

    # ── POLICY SCAN: PUSH A MAIN / HOTFIX ─────────────────────
    # NOTA: en push a main/hotfix este Policy Scan corre y, a continuación,
    # más abajo, también corre el Pipeline Scan sobre el mismo artefacto
    # (dos subidas + dos análisis SAST en serie, en el mismo job). Confirmar
    # con el equipo si ambos gates son necesarios en esas ramas o si el
    # Pipeline Scan puede omitirse cuando ya corre el Policy Scan completo.

    - name: Veracode Policy Scan
      if: >-
        ${{
          steps.configuration.outputs.is_dotnet == 'true' &&
          github.event_name == 'push' &&
          (
            github.ref_name == 'main' ||
            github.ref_name == 'hotfix'
          )
        }}
      uses: veracode/veracode-uploadandscan-action@0.2.11
      with:
        appname: ${{ steps.configuration.outputs.veracode_app_name }}
        createprofile: true
        filepath: ${{ steps.package.outputs.package_directory }}
        vid: ${{ inputs.veracode-api-id }}
        vkey: ${{ inputs.veracode-api-key }}
        teams: ${{ inputs.veracode-team }}

    # ── SAST: PIPELINE SCAN ────────────────────────────────────

    - name: Setup JDK 11
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: temurin

    - name: Fecha para key de caché
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      id: pipeline-scan-date
      shell: bash
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Cache Pipeline Scanner
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      id: cache-pipeline-scan
      uses: actions/cache@v4
      with:
        path: pipeline-scan.jar
        # Veracode recomienda descargar el ZIP en cada corrida para garantizar
        # la última versión, pero también permite cachearlo localmente y
        # refrescarlo a intervalos regulares. Usamos la fecha (AAAA-MM-DD)
        # como parte de la key para refrescar la caché una vez por día en
        # vez de descargar el JAR (~decenas de MB) en cada ejecución.
        key: veracode-pipeline-scan-${{ runner.os }}-${{ steps.pipeline-scan-date.outputs.date }}

    - name: Descargar Pipeline Scanner
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' && steps.cache-pipeline-scan.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail

        curl --fail --silent --show-error --location \
          --remote-name \
          https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip

        unzip -o pipeline-scan-LATEST.zip

    - name: Ejecutar Pipeline Scan
      if: ${{ steps.configuration.outputs.is_dotnet == 'true' }}
      id: scan
      continue-on-error: true
      shell: bash
      env:
        VID: ${{ inputs.veracode-api-id }}
        VKEY: ${{ inputs.veracode-api-key }}
        FAIL_ON_SEV: ${{ inputs.fail-on-severity }}
        SCAN_TIMEOUT: ${{ inputs.scan-timeout }}
        PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
      run: |
        set -Eeuo pipefail

        BASELINE=()

        if [[ -f veracode-baseline.json ]]; then
          BASELINE=(--baseline_file veracode-baseline.json)
          echo "[INFO] Baseline presente: se evaluarán findings nuevos."
        else
          echo "[INFO] Sin baseline: se evaluarán todos los findings."
        fi

        java -jar pipeline-scan.jar \
          -vid "$VID" \
          -vkey "$VKEY" \
          --file "$PACKAGE_PATH" \
          --project_name "$GITHUB_REPOSITORY" \
          --project_url "https://github.com/$GITHUB_REPOSITORY" \
          --json_output_file results.json \
          --filtered_json_output_file filtered_results.json \
          --timeout "$SCAN_TIMEOUT" \
          "${BASELINE[@]}" \
          --fail_on_severity "$FAIL_ON_SEV"

    - name: Convertir resultados a SARIF
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' && hashFiles('results.json') != '' }}
      continue-on-error: true
      uses: veracode/veracode-pipeline-scan-results-to-sarif@v2.0.5
      with:
        pipeline-results-json: results.json
        noupload: 'true'

    - name: Publicar SARIF en Security
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' && hashFiles('veracode-results.sarif') != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: veracode-results.sarif
        category: veracode-pipeline-scan

    - name: Guardar resultados SAST
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: veracode-pipeline-results
        if-no-files-found: warn
        path: |
          results.json
          filtered_results.json
          veracode-results.sarif

    # ── SCA: AGENT-BASED ───────────────────────────────────────

    - name: Veracode SCA Agent-Based
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' && inputs.srcclr-api-token != '' }}
      id: sca
      continue-on-error: true
      uses: veracode/veracode-sca@v2.1.19
      env:
        SRCCLR_API_TOKEN: ${{ inputs.srcclr-api-token }}
      with:
        github_token: ${{ inputs.github_token }}
        create-issues: true
        quick: false
        allow-dirty: true

    # ── PR COMMENT ─────────────────────────────────────────────

    - name: Comentar resultados en el PR
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FAIL_ON_SEV: ${{ inputs.fail-on-severity }}
        SCA_OUTCOME: ${{ steps.sca.outcome }}
        SCA_REPORT_URL: ${{ steps.sca.outputs.scan-url || inputs.sca-report-url }}
        SCA_TOKEN: ${{ inputs.srcclr-api-token }}
      run: |
        set -Eeuo pipefail

        SEVN='{"5":"Very High","4":"High","3":"Medium","2":"Low","1":"Very Low","0":"Info"}'
        SCA_LABEL="Veracode Dependency Scanning"
        SCA_ISSUES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues?q=is%3Aissue+is%3Aopen+label%3A%22Veracode+Dependency+Scanning%22"

        # ── Métricas SAST ──────────────────────────────────────

        SAST_RESULTS_AVAILABLE="false"
        BLOCKING=0
        TOTAL=0
        ACCEPTED=0

        if [[ -f filtered_results.json ]] \
          && jq -e '(.findings // []) | type == "array"' filtered_results.json >/dev/null 2>&1; then

          SAST_RESULTS_AVAILABLE="true"
          BLOCKING="$(jq '(.findings // []) | length' filtered_results.json)"

          if [[ -f results.json ]] \
            && jq -e '(.findings // []) | type == "array"' results.json >/dev/null 2>&1; then
            TOTAL="$(jq '(.findings // []) | length' results.json)"
          else
            TOTAL="$BLOCKING"
          fi

          ACCEPTED=$((TOTAL - BLOCKING))

          # Evita mostrar valores negativos si los archivos no pertenecen
          # exactamente a la misma ejecución.
          if [[ "$ACCEPTED" -lt 0 ]]; then
            ACCEPTED=0
          fi
        fi

        # ── Métricas SCA ───────────────────────────────────────

        SCA_ISSUES_KNOWN="false"
        SCA_OPEN_ISSUES=0

        if [[ -n "$SCA_TOKEN" ]]; then
          if SCA_OPEN_ISSUES="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label "$SCA_LABEL" \
              --limit 1000 \
              --json number \
              --jq 'length' \
              2>/dev/null
          )"; then
            if [[ "$SCA_OPEN_ISSUES" =~ ^[0-9]+$ ]]; then
              SCA_ISSUES_KNOWN="true"
            fi
          else
            SCA_OPEN_ISSUES=0
          fi
        fi

        {
          # ── SAST ─────────────────────────────────────────────

          if [[ "$SAST_RESULTS_AVAILABLE" == "true" ]]; then
            echo "## 🛡️ Veracode Pipeline Scan (SAST) — $BLOCKING bloqueante(s), $ACCEPTED aceptado(s) por baseline"
            echo ""
            echo "Gate: \`$FAIL_ON_SEV\` sobre findings nuevos. Total detectado: **$TOTAL**."
            echo ""

            if [[ "$BLOCKING" -eq 0 ]]; then
              echo "✅ Sin findings nuevos en este PR — **merge habilitado**."
            else
              echo "⛔ Se detectaron **$BLOCKING finding(s) nuevo(s) bloqueante(s)** — merge bloqueado."
              echo ""
              echo "| Severidad | CWE | Tipo | Ubicación |"
              echo "|---|---|---|---|"

              jq -r --argjson sev "$SEVN" '
                limit(60;
                  .findings[]?
                  | . as $finding
                  | (
                      $finding.files.source_file.file
                      // "archivo desconocido"
                      | sub("^/?home/runner/work/[^/]+/[^/]+/"; "")
                    ) as $path
                  | "| \(
                      $sev[($finding.severity | tostring)]
                      // ($finding.severity | tostring)
                    ) | [CWE-\($finding.cwe_id // "?")](https://cwe.mitre.org/data/definitions/\($finding.cwe_id // "").html) | \($finding.issue_type // "desconocido") | `\($path):\($finding.files.source_file.line // "?")` |"
                )
              ' filtered_results.json

              if [[ "$BLOCKING" -gt 60 ]]; then
                echo ""
                echo "_Se muestran los primeros 60 findings bloqueantes. El resultado completo está disponible en el artifact del pipeline._"
              fi
            fi

            if [[ "$ACCEPTED" -gt 0 && -f results.json ]]; then
              echo ""
              echo "<details>"
              echo "<summary>🟡 $ACCEPTED aceptado(s) por baseline (no bloquean)</summary>"
              echo ""
              echo "| Severidad | CWE | Tipo | Ubicación |"
              echo "|---|---|---|---|"

              jq -r --argjson sev "$SEVN" --slurpfile filtered filtered_results.json '
                (
                  ($filtered[0].findings // [])
                  | map([
                      .cwe_id,
                      .files.source_file.file,
                      .files.source_file.line
                    ])
                ) as $blocking
                | limit(60;
                    .findings[]?
                    | . as $finding
                    | [
                        $finding.cwe_id,
                        $finding.files.source_file.file,
                        $finding.files.source_file.line
                      ] as $key
                    | select(any($blocking[]; . == $key) | not)
                    | (
                        $finding.files.source_file.file
                        // "archivo desconocido"
                        | sub("^/?home/runner/work/[^/]+/[^/]+/"; "")
                      ) as $path
                    | "| \(
                        $sev[($finding.severity | tostring)]
                        // ($finding.severity | tostring)
                      ) | [CWE-\($finding.cwe_id // "?")](https://cwe.mitre.org/data/definitions/\($finding.cwe_id // "").html) | \($finding.issue_type // "desconocido") | `\($path):\($finding.files.source_file.line // "?")` |"
                  )
              ' results.json

              if [[ "$ACCEPTED" -gt 60 ]]; then
                echo ""
                echo "_Se muestran los primeros 60 findings aceptados. El resultado completo está disponible en el artifact del pipeline._"
              fi

              echo ""
              echo "</details>"
            fi
          else
            echo "## 🛡️ Veracode Pipeline Scan (SAST) — sin resultados"
            echo ""
            echo "❌ Pipeline Scan no generó archivos JSON válidos."
            echo ""
            echo "Revisá los logs del scanner, las credenciales VID/VKEY y los permisos de Veracode."
          fi

          # ── SCA ──────────────────────────────────────────────

          echo ""
          echo "---"
          echo ""
          echo "## 📦 Veracode SCA — dependencias vulnerables"
          echo ""

          case "${SCA_OUTCOME:-skipped}" in
            success)
              if [[ "$SCA_ISSUES_KNOWN" == "true" ]]; then
                if [[ "$SCA_OPEN_ISSUES" -gt 0 ]]; then
                  echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: 🟠 **$SCA_OPEN_ISSUES dependencia(s) vulnerable(s) abierta(s)** — ver Issues."
                else
                  echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ✅ **sin dependencias vulnerables abiertas**."
                fi
              else
                echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ✅ análisis completado; no se pudo consultar la cantidad de Issues abiertos."
              fi
              ;;
            failure)
              echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ❌ **el análisis SCA falló** — revisá los logs del action."
              ;;
            cancelled)
              echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ⚠️ **análisis cancelado**."
              ;;
            skipped)
              if [[ -z "$SCA_TOKEN" ]]; then
                echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ℹ️ **no ejecutado porque no se configuró srcclr-api-token**."
              else
                echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ℹ️ **no ejecutado**."
              fi
              ;;
            *)
              echo "Escaneo agent-based del árbol de dependencias (**no es SAST**). Estado: ℹ️ \`${SCA_OUTCOME:-desconocido}\`."
              ;;
          esac

          echo ""

          if [[ -n "$SCA_REPORT_URL" ]]; then
            echo "- Reporte completo: [$SCA_REPORT_URL]($SCA_REPORT_URL)"
          fi

          echo "- Detalle por vulnerabilidad: [Issues con label \`$SCA_LABEL\`]($SCA_ISSUES_URL)."
        } > pr_comment.md

        gh pr comment "$PR_NUMBER" \
          --repo "$GITHUB_REPOSITORY" \
          --body-file pr_comment.md \
          || echo "::warning::No se pudo comentar el PR."

    # ── JOB SUMMARY ─────────────────────────────────────────────

    - name: Generar Job Summary
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' && github.event_name != 'pull_request' }}
      shell: bash
      env:
        FAIL_ON_SEV: ${{ inputs.fail-on-severity }}
        SCA_OUTCOME: ${{ steps.sca.outcome }}
        SCA_REPORT_URL: ${{ steps.sca.outputs.scan-url || inputs.sca-report-url }}
      run: |
        set -Eeuo pipefail

        {
          echo "## 🔐 Veracode DevSecOps — Resultado del push"
          echo ""
          echo "| Campo | Valor |"
          echo "|---|---|"
          echo "| Rama | \`${GITHUB_REF_NAME}\` |"
          echo "| Commit | \`${GITHUB_SHA::7}\` |"
          echo "| Workflow | [Ver ejecución](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          echo ""

          # ── SAST ─────────────────────────────────────────────

          echo "### 🛡️ Veracode Pipeline Scan — SAST"
          echo ""

          if [[ -f filtered_results.json ]]; then
            BLOCKING="$(jq '[.findings[]?] | length' filtered_results.json)"
            TOTAL="$(
              if [[ -f results.json ]]; then
                jq '[.findings[]?] | length' results.json
              else
                echo "$BLOCKING"
              fi
            )"
            ACCEPTED=$((TOTAL - BLOCKING))

            echo "Gate configurado: \`$FAIL_ON_SEV\`"
            echo ""
            echo "| Métrica | Resultado |"
            echo "|---|---:|"
            echo "| Total detectado | $TOTAL |"
            echo "| Nuevos bloqueantes | $BLOCKING |"
            echo "| Aceptados por baseline | $ACCEPTED |"
            echo ""

            if [[ "$BLOCKING" -eq 0 ]]; then
              echo "✅ **Sin vulnerabilidades bloqueantes en esta rama.**"
            else
              echo "❌ **Se detectaron vulnerabilidades bloqueantes.**"
            fi

            if [[ "$ACCEPTED" -gt 0 ]]; then
              echo ""
              echo "<details>"
              echo "<summary>🟡 $ACCEPTED aceptado(s) por baseline</summary>"
              echo ""
              echo "Los findings aceptados por baseline no bloquean el gate, pero permanecen visibles en Security y en el artifact del pipeline."
              echo ""
              echo "</details>"
            fi
          else
            echo "❌ **Pipeline Scan no generó resultados.**"
            echo ""
            echo "Revisá los logs del scanner, las credenciales VID/VKEY y los permisos de Veracode."
          fi

          # ── SCA ──────────────────────────────────────────────

          echo ""
          echo "---"
          echo ""
          echo "### 📦 Veracode SCA — Dependencias"
          echo ""

          case "${SCA_OUTCOME:-skipped}" in
            success)
              echo "✅ **Análisis SCA completado.**"
              ;;
            failure)
              echo "❌ **El análisis SCA falló.** Revisá los logs del action."
              ;;
            cancelled)
              echo "⚠️ **El análisis SCA fue cancelado.**"
              ;;
            skipped)
              echo "ℹ️ **SCA no fue ejecutado.** No se configuró el token SRCCLR."
              ;;
            *)
              echo "ℹ️ **Estado SCA:** \`${SCA_OUTCOME:-desconocido}\`."
              ;;
          esac

          echo ""
          echo "El análisis SCA revisa dependencias y no es un análisis SAST."
          echo ""
          echo "- [Ver issues SCA](https://github.com/$GITHUB_REPOSITORY/issues?q=is%3Aissue+is%3Aopen+label%3A%22Veracode+Dependency+Scanning%22)"

          if [[ -n "$SCA_REPORT_URL" ]]; then
            echo "- Ver reporte completo de Veracode SCA: [$SCA_REPORT_URL]($SCA_REPORT_URL)"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # ── GATE SAST ──────────────────────────────────────────────

    - name: Aplicar gate de Pipeline Scan
      if: ${{ always() && steps.configuration.outputs.is_dotnet == 'true' }}
      shell: bash
      env:
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
      run: |
        set -Eeuo pipefail

        if [[ -f filtered_results.json ]]; then
          if [[ "$SCAN_OUTCOME" == "success" ]]; then
            echo "✅ Pipeline Scan completado sin findings bloqueantes."
            exit 0
          fi

          echo "::warning::Pipeline Scan encontró findings bloqueantes."
          exit 0
        fi

        case "$SCAN_OUTCOME" in
          cancelled)
            echo "::error::Pipeline Scan fue cancelado."
            exit 1
            ;;
          skipped)
            echo "::error::Pipeline Scan fue omitido porque falló un paso anterior."
            exit 1
            ;;
          failure)
            echo "::error::Pipeline Scan falló y no generó resultados."
            echo "::error::Revisá VID/VKEY, permisos de Veracode y los logs del scanner."
            exit 0
            ;;
          *)
            echo "::error::Pipeline Scan no generó resultados."
            echo "::error::Outcome recibido: $SCAN_OUTCOME"
            exit 1
            ;;
        esac

    # ── RESULTADO FINAL ────────────────────────────────────────

    - name: Publicar resultado
      id: result
      if: ${{ always() }}
      shell: bash
      env:
        IS_DOTNET: ${{ steps.configuration.outputs.is_dotnet }}
      run: |
        set -Eeuo pipefail

        MATCHED="${IS_DOTNET:-false}"

        echo "workflow_matched=$MATCHED" >> "$GITHUB_OUTPUT"
        echo "Workflow matched: $MATCHED"