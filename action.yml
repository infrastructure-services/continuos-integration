name: "Continuos Integration Wrapper"
description: "Este archivo de pipeline de CI/CD es una plantilla genérica diseñada para soportar múltiples tecnologías y frameworks. Su objetivo es automatizar los pasos de integración y despliegue para proyectos de software, garantizando un proceso de desarrollo y entrega eficiente y consistente."

inputs:
  workflow: 
    description: "nombre del workflow a ejecutar"
    required: true
    
  # Github
  github_username:
    description: "usuario de github para autenticarse en los packages"
    required: true
  github_token:
    description: "token del usuario con permisos de lectura en packages"
    required: true

  # Directories
  workdir_src:
    description: "directorio donde se encuentra el project a compilar DEFAULT: ./"
    required: false
    default: './'
  workdir_test:
    description: "directorio donde se encuentra los test DEFAULT: ./"
    required: false
    default: './'


  # Build
  version:
    description: "Versión de Python para los workflows Python / PythonData (ej: '3.11', '3.12'). Mínimo 3.9: el tooling del pipeline (pytest-cov 6.0.0) no soporta versiones anteriores, y 3.8 está EOL desde oct 2024."
    required: false
    default: '3.12'
  matrix_version:
    description: "matrix de pruebas node"
    required: false
    default: ""
  go_version:
    description: "Versión de Go a instalar para el build"
    required: false
    default: 'stable' 

  ## Build React
  fontawesome_token: 
    description: "token de fontawesome"
    required: false
    default: ''
  ## pnpm version
  pnpm_version:
    description: "version de pnpm"
    required: false
    default: '10'

#Configuraciones de Sentinel
  sentinel_url:
    description: "URL base de la API de Sentinel (sin trailing slash)"
    required: false
    default: "https://github-integration.andreani.com"
  sentinel_sensor_id:
    description: "ID del sensor en Sentinel al que se reportan los análisis"
    required: false
    default: "1"
  gitops_url:
    description: "URL base de la UI de GitOps (sin trailing slash)"
    required: false
    default: "https://gitops.andreani.com"
  scan_id:
    description: "ScanId para consultar el Quality Gate en la API Sentinel"
    required: false
    default: 1
  workdir_frontend:
    description: "directorio donde se encuentra el frontend DEFAULT: ./src/front"
    required: false
    default: './src/front'

runs:
  using: "composite"
  steps:
    - name: Check Application
      uses: infrastructure-services/continuos-integration@check-if-exists-app
#Comento todo ya que sonar no va más
    - name: Init workflow match flag
      run: echo "WORKFLOW_MATCHED=false" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration .NET"
      if: ${{ inputs.workflow == '.NET' }}
      uses: infrastructure-services/continuos-integration@cicdv3-net-8
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        sentinel_url: ${{ inputs.sentinel_url }}
        sentinel_sensor_id: ${{ inputs.sentinel_sensor_id }}
        gitops_url: ${{ inputs.gitops_url }}
        scan_id: ${{ inputs.scan_id }}
        dotnet-version: '6.0.x'

    - name: Mark matched (.NET)
      if: ${{ inputs.workflow == '.NET' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration .NET 10"
      if: ${{ inputs.workflow == '.NET 10' }}
      uses: infrastructure-services/continuos-integration@cicdv3-net-8
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        sentinel_url: ${{ inputs.sentinel_url }}
        sentinel_sensor_id: ${{ inputs.sentinel_sensor_id }}
        gitops_url: ${{ inputs.gitops_url }}
        scan_id: ${{ inputs.scan_id }}
        dotnet-version: '10.0.x'

    - name: Mark matched (.NET 10)
      if: ${{ inputs.workflow == '.NET 10' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration .NET 8"
      if: ${{ inputs.workflow == '.NET 8' }}
      uses: infrastructure-services/continuos-integration@cicdv3-net-8
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        sentinel_url: ${{ inputs.sentinel_url }}
        sentinel_sensor_id: ${{ inputs.sentinel_sensor_id }}
        gitops_url: ${{ inputs.gitops_url }}
        scan_id: ${{ inputs.scan_id }}
        dotnet-version: '8.0.x'

    - name: Mark matched (.NET 8)
      if: ${{ inputs.workflow == '.NET 8' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration Javascript"
      if: ${{ inputs.workflow == 'CRA' || inputs.workflow == 'Vite' || inputs.workflow == 'Rsbuild' || inputs.workflow == 'Next.js' || inputs.workflow == 'React Native' }}
      uses: infrastructure-services/continuos-integration@javascript-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        matrix_version: ${{ inputs.matrix_version }}
        fontawesome_token: ${{ inputs.fontawesome_token }}
        pnpm_version: ${{ inputs.pnpm_version }}
        sentinel_url: ${{ inputs.sentinel_url }}
        gitops_url: ${{ inputs.gitops_url }}

    - name: Mark matched (Javascript)
      if: ${{ inputs.workflow == 'CRA' || inputs.workflow == 'Vite' || inputs.workflow == 'Rsbuild' || inputs.workflow == 'Next.js' || inputs.workflow == 'React Native' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration Javascript Node24 y PNPM 11"
      if: ${{ inputs.workflow == 'Node24' }}
      uses: infrastructure-services/continuos-integration@javascript-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        matrix_version: '24.x'
        fontawesome_token: ${{ inputs.fontawesome_token }}
        pnpm_version: '11.x'
        sentinel_url: ${{ inputs.sentinel_url }}
        gitops_url: ${{ inputs.gitops_url }}

    - name: Mark matched (Javascript)
      if: ${{ inputs.workflow == 'Node24' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration Golang"
      if: ${{ inputs.workflow == 'Go' }}
      uses: infrastructure-services/continuos-integration@go-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        #Esto es así porque el setup de Go no acepta rutas relativas como cache de dependencias
        workdir_src: ${{ (inputs.workdir_src == './') && '/src' || inputs.workdir_src }}
        workdir_test: ${{ (inputs.workdir_test == './') && '/src' || inputs.workdir_test }}
        ##
        sentinel_url: ${{ inputs.sentinel_url }}
        sentinel_sensor_id: ${{ inputs.sentinel_sensor_id }}
        gitops_url: ${{ inputs.gitops_url }}
        go_version: ${{ inputs.go_version }}

    - name: Mark matched (Go)
      if: ${{ inputs.workflow == 'Go' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration Python"
      if: ${{ inputs.workflow == 'Python' || inputs.workflow == 'PythonData' }}
      uses: infrastructure-services/continuos-integration@python-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        version: ${{ inputs.version }}
        sentinel_url: ${{ inputs.sentinel_url }}
        gitops_url: ${{ inputs.gitops_url }}

    - name: Mark matched (Python)
      if: ${{ inputs.workflow == 'Python' || inputs.workflow == 'PythonData' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash
      
    - name: "Continuos Integration Python 3.11"
      if: ${{ inputs.workflow == 'Python311' }}
      uses: infrastructure-services/continuos-integration@python-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        sentinel_url: ${{ inputs.sentinel_url }}
        gitops_url: ${{ inputs.gitops_url }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        version: '3.11.0'

    - name: Mark matched (Python311)
      if: ${{ inputs.workflow == 'Python311' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash


    - name: Mark matched (React Native)
      if: ${{ inputs.workflow == 'React Native' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration HTML"
      if: ${{ inputs.workflow == 'html' }}
      uses: infrastructure-services/continuos-integration@html-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        matrix_version: ${{ inputs.matrix_version }}


    - name: Mark matched (html)
      if: ${{ inputs.workflow == 'html' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration PHP"
      if: ${{ inputs.workflow == 'php' }}
      uses: infrastructure-services/continuos-integration@php-cicdv3
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        matrix_version: ${{ inputs.matrix_version }}
        
    - name: Mark matched (php)
      if: ${{ inputs.workflow == 'php' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: "Continuos Integration .NET Windows MVC"
      if: ${{ inputs.workflow == 'WinMVC' }}
      uses: infrastructure-services/continuos-integration@net-mvc
      with:
        github_username: ${{ inputs.github_username }}
        github_token: ${{ inputs.github_token }}
        workdir_src: ${{ inputs.workdir_src }}
        workdir_test: ${{ inputs.workdir_test }}
        sentinel_url: ${{ inputs.sentinel_url }}
        sentinel_sensor_id: ${{ inputs.sentinel_sensor_id }}
        gitops_url: ${{ inputs.gitops_url }}
        scan_id: ${{ inputs.scan_id }}
        dotnet-version: '10.0.x'
        matrix_version: '24.x'
        fontawesome_token: ${{ inputs.fontawesome_token }}
        pnpm_version: '11.x'
        workdir_frontend: ${{ inputs.workdir_frontend }}

    - name: Mark matched (WinMVC)
      if: ${{ inputs.workflow == 'WinMVC' }}
      run: echo "WORKFLOW_MATCHED=true" >> $GITHUB_ENV
      shell: bash

    - name: Validation of Supported Workflows
      if: ${{ env.WORKFLOW_MATCHED != 'true' }}
      run: |
        echo "::error title=❌ Unsupported workflow::'${{ inputs.workflow }}' no está soportado. Contactar a Devops para revisar la variable WORKFLOW_CI. Workflows soportados: .NET, .NET 8, .NET 10, CRA, Vite, Rsbuild, Next.js, Node24, Go, Python, PythonData, Python311, React Native, html, php, WinMVC."
        exit 1
      shell: bash

