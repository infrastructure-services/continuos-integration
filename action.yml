name: 'Validaciones'
description: 'Valida que los commits y el título del PR cumplan con la convención de JIRA y Conventional Commits'
author: 'Antony Fagundez <afagundez@andreani.com>'
inputs:
  token:
    description: 'GitHub Access Token'
    required: false
    default: ${{ github.token }}
  jira_email:
    description: 'JIRA Email'
    required: true
  jira_api_token:
    description: 'JIRA API Token'
    required: true
  jira_host:
    description: 'JIRA Host URL'
    required: false
    default: 'https://andreani.atlassian.net'

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  color: red
  icon: search
